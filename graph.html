<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Composio Tool Dependency Graph — Google Super &amp; GitHub</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel-bg: #12161f;
    --border: #232a38;
    --text: #d7dce3;
    --muted: #8b93a3;
    --accent: #5aa9ff;
    --googlesuper: #4fc3f7;
    --github: #ffb454;
    --lookup: #5aa9ff;
    --creates: #66d19e;
    --resolve: #c792ea;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; overflow: hidden; }
  #app { display: flex; width: 100%; height: 100%; }
  #graphWrap { position: relative; flex: 1; overflow: hidden; cursor: grab; }
  #graphWrap.dragging { cursor: grabbing; }
  svg { width: 100%; height: 100%; display: block; }
  #sidebar { width: 340px; flex-shrink: 0; background: var(--panel-bg); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  #controls { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  #controls h1 { font-size: 14px; margin: 0 0 4px; font-weight: 600; }
  #controls .sub { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
  #search { width: 100%; padding: 7px 9px; background: #1a2029; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 12px; margin-bottom: 10px; }
  #search:focus { outline: none; border-color: var(--accent); }
  .filterGroup { margin-bottom: 10px; }
  .filterGroup .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 6px; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 0; cursor: pointer; user-select: none; }
  .chk input { cursor: pointer; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .stats { font-size: 11px; color: var(--muted); padding: 8px 16px; border-bottom: 1px solid var(--border); }
  #detail { flex: 1; overflow-y: auto; padding: 16px; font-size: 12.5px; line-height: 1.5; }
  #detail .empty { color: var(--muted); font-size: 12px; margin-top: 20px; text-align: center; }
  #detail h2 { font-size: 14px; margin: 0 0 2px; word-break: break-word; }
  #detail .slugline { font-size: 10.5px; color: var(--muted); margin-bottom: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #detail .desc { color: #b7bfcc; margin-bottom: 14px; }
  #detail .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 14px 0 6px; }
  #detail .req { display: inline-block; background: #1a2029; border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; margin: 2px 3px 0 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  .edgeItem { border-left: 2px solid var(--border); padding: 6px 0 6px 10px; margin-bottom: 6px; cursor: pointer; }
  .edgeItem:hover { border-left-color: var(--accent); background: #161c27; }
  .edgeItem .who { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--text); }
  .edgeItem .note { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .tag { display: inline-block; font-size: 9.5px; padding: 1px 5px; border-radius: 3px; margin-left: 6px; vertical-align: middle; }
  .tag.lookup { background: rgba(90,169,255,0.18); color: var(--lookup); }
  .tag.creates { background: rgba(102,209,158,0.18); color: var(--creates); }
  .tag.resolve-identity { background: rgba(199,146,234,0.18); color: var(--resolve); }
  #tooltip { position: absolute; pointer-events: none; background: #1a2029; border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font-size: 11.5px; max-width: 280px; display: none; z-index: 10; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
  #tooltip .t-slug { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent); font-size: 11px; }
  #zoomHint { position: absolute; bottom: 10px; left: 12px; font-size: 10.5px; color: var(--muted); background: rgba(18,22,31,0.75); padding: 4px 8px; border-radius: 5px; }
  a, a:visited { color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div id="graphWrap">
    <svg id="svg"></svg>
    <div id="tooltip"></div>
    <div id="zoomHint">scroll to zoom · drag to pan · click a node for details</div>
  </div>
  <div id="sidebar">
    <div id="controls">
      <h1>Composio Tool Dependency Graph</h1>
      <div class="sub">Google Super &amp; GitHub — precursor actions required before a tool can run</div>
      <input id="search" type="text" placeholder="Search tool name or slug…" />
      <div class="filterGroup">
        <div class="label">Toolkit</div>
        <label class="chk"><input type="checkbox" data-toolkit="googlesuper" checked><span class="swatch" style="background:var(--googlesuper)"></span> Google Super</label>
        <label class="chk"><input type="checkbox" data-toolkit="github" checked><span class="swatch" style="background:var(--github)"></span> GitHub</label>
      </div>
      <div class="filterGroup">
        <div class="label">Edge type</div>
        <label class="chk"><input type="checkbox" data-etype="lookup" checked><span class="swatch" style="background:var(--lookup)"></span> lookup (list/search/get first)</label>
        <label class="chk"><input type="checkbox" data-etype="creates" checked><span class="swatch" style="background:var(--creates)"></span> creates (id comes from creating it)</label>
        <label class="chk"><input type="checkbox" data-etype="resolve-identity" checked><span class="swatch" style="background:var(--resolve)"></span> resolve-identity (name → email/login)</label>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div id="detail"><div class="empty">Click any node to see its required inputs and the tools that can supply them.</div></div>
  </div>
</div>
<script>
const GRAPH = {"generatedFrom":["googlesuper","github"],"totalToolsScanned":1360,"nodeCount":800,"edgeCount":1725,"nodes":[{"slug":"GOOGLESUPER_ACL_LIST","toolkit":"googlesuper","name":"List ACL Rules","description":"Retrieves the list of access control rules (ACLs) for a specified calendar, providing the necessary 'rule_id' values required for updating specific ACL rules.","requiredInputs":["calendarId"],"family":"rule"},{"slug":"GOOGLESUPER_ACL_DELETE","toolkit":"googlesuper","name":"Delete ACL Rule","description":"Deletes an access control rule from a Google Calendar. Use when you need to remove sharing permissions for a user, group, or domain.","requiredInputs":["rule_id","calendar_id"],"family":"rule"},{"slug":"GOOGLESUPER_ACL_INSERT","toolkit":"googlesuper","name":"Create ACL Rule","description":"Creates an access control rule for a calendar. Use when you need to grant sharing permissions to a user, group, or domain.","requiredInputs":["role","scope","calendar_id"],"family":"rule"},{"slug":"GOOGLESUPER_ACL_WATCH","toolkit":"googlesuper","name":"Watch ACL Changes","description":"Tool to watch for changes to ACL resources. Use when you need to set up real-time notifications for access control list modifications on a calendar.","requiredInputs":["id","address","calendarId"],"family":"rule"},{"slug":"GOOGLESUPER_CALENDAR_LIST_INSERT","toolkit":"googlesuper","name":"Insert Calendar into List","description":"Inserts an existing calendar into the user's calendar list, making it visible in the UI. Calendars (e.g., newly created ones) won't appear in the list or UI until explicitly inserted.","requiredInputs":["id"],"family":"calendar"},{"slug":"GOOGLESUPER_CALENDAR_LIST_WATCH","toolkit":"googlesuper","name":"Watch Calendar List","description":"Watch for changes to CalendarList resources using push notifications. Use this to receive real-time updates when calendar list entries are modified.","requiredInputs":["id","type","address"],"family":"calendar"},{"slug":"GOOGLESUPER_EVENTS_LIST","toolkit":"googlesuper","name":"List Events","description":"Returns events on the specified calendar. TIMEZONE WARNING: When using timeMin/timeMax with UTC timestamps (ending in 'Z'), the time window is interpreted in UTC regardless of the calendar's timezone. For example, querying '2026-01-19T00:00:00Z' to '2026-01-20T00:00:00Z' on a calendar in America/Los_Angeles (UTC-8) covers 2026-01-18 4pm to 2026-01-19 4pm local time, potentially missing events on the intended local date. To query for a specific local date, use timestamps with the appropriate timezone offset in timeMin/timeMax (e.g., '2026-01-19T00:00:00-08:00' for PST).","requiredInputs":[],"family":"other"},{"slug":"GOOGLESUPER_ACL_GET","toolkit":"googlesuper","name":"Get ACL Rule","description":"Retrieves a specific access control rule for a calendar. Use when you need to check permissions for a specific user, group, or domain.","requiredInputs":["rule_id","calendar_id"],"family":"rule"},{"slug":"GOOGLESUPER_ACL_PATCH","toolkit":"googlesuper","name":"Patch ACL Rule","description":"Updates an existing access control rule for a calendar using patch semantics (partial update). This allows modifying specific fields without affecting other properties. IMPORTANT: The ACL rule must already exist on the calendar. This action cannot create new rules. If you receive a 404 Not Found error, the rule does not exist - use ACL insert to create it first, or use ACL list to verify available rules. Each patch request consumes three quota units. For domain-type ACL rules, if PATCH fails with 500 error, this action will automatically fallback to UPDATE method.","requiredInputs":["rule_id","calendar_id"],"family":"rule"},{"slug":"GOOGLESUPER_ACL_UPDATE","toolkit":"googlesuper","name":"Update ACL Rule","description":"Updates an access control rule for the specified calendar.","requiredInputs":["role","rule_id","calendar_id"],"family":"rule"},{"slug":"GOOGLESUPER_FIND_FILE","toolkit":"googlesuper","name":"Find file","description":"The comprehensive Google Drive search tool that handles all file and folder discovery needs. Use this for any file finding task - from simple name searches to complex queries with date filters, MIME types, permissions, custom properties, folder scoping, and more. Searches across My Drive and shared drives with full metadata support. Examples: - Find PDFs: q=\"mimeType = 'application/pdf'\" - Find recent files: q=\"modifiedTime > '2024-01-01T00:00:00'\" - Search by name: q=\"name contains 'report'\" - Files in folder: folderId=\"abc123\" or q=\"'FOLDER_ID' in parents\"","requiredInputs":[],"family":"file"},{"slug":"GOOGLESUPER_ADD_FILE_SHARING_PREFERENCE","toolkit":"googlesuper","name":"Add file sharing preference (Deprecated)","description":"DEPRECATED: Use GOOGLEDRIVE_CREATE_PERMISSION instead; use GOOGLEDRIVE_UPDATE_PERMISSION to modify existing permissions (avoids duplicate entries). Modifies sharing permissions for an existing Google Drive file, granting a specified role to a user, group, domain, or 'anyone'. Bulk calls may trigger 403 rateLimitExceeded (~100 req/100s/user); use jittered exponential backoff.","requiredInputs":["role","type","file_id"],"family":"file"},{"slug":"GOOGLESUPER_FIND_FOLDER","toolkit":"googlesuper","name":"Find folder","description":"Tool to find a folder in Google Drive by its name and optionally a parent folder. Use when you need to locate a specific folder to perform further actions like creating files in it or listing its contents.","requiredInputs":[],"family":"file"},{"slug":"GOOGLESUPER_LIST_CHANGES","toolkit":"googlesuper","name":"List Changes","description":"Tool to list the changes for a user or shared drive. Use when a full incremental change feed is needed (for simple recent-file lookups, prefer GOOGLEDRIVE_FIND_FILE instead). Tracks modifications such as creations, deletions, or permission changes. The pageToken is optional - if not provided, the current start page token will be automatically fetched; an empty result is valid if no recent activity has occurred. Example usage: ```json { \"pageToken\": \"22633\", \"pageSize\": 100, \"includeRemoved\": true } ``` Returns changes with timestamps, file IDs, and modification details. Paginate by following `nextPageToken` until it is absent — stopping early will silently omit changes. Save `newStartPageToken` to monitor future changes efficiently.","requiredInputs":[],"family":"other"},{"slug":"GOOGLESUPER_LIST_HISTORY","toolkit":"googlesuper","name":"List Gmail history","description":"Tool to list Gmail mailbox change history since a known startHistoryId. Use for incremental mailbox syncs. Persist the latest historyId as a checkpoint across sessions; without it, incremental sync is unreliable. An empty history list in the response is valid and means no new changes occurred.","requiredInputs":["start_history_id"],"family":"other"},{"slug":"GOOGLESUPER_ADD_LABEL_TO_EMAIL","toolkit":"googlesuper","name":"Modify email labels","description":"Adds and/or removes specified Gmail labels for a message; ensure `message_id` and all `label_ids` are valid (use 'listLabels' for custom label IDs).","requiredInputs":["message_id"],"family":"label"},{"slug":"GOOGLESUPER_LIST_MESSAGES","toolkit":"googlesuper","name":"List Gmail messages (Deprecated)","description":"DEPRECATED: Use GMAIL_FETCH_EMAILS instead. Lists the messages in the user's mailbox. Use when you need to retrieve a list of email messages with optional filtering by labels or search query.","requiredInputs":[],"family":"other"},{"slug":"GOOGLESUPER_INSERT_MESSAGE","toolkit":"googlesuper","name":"Insert message into mailbox","description":"Tool to insert a message into the user's mailbox similar to IMAP APPEND. Use when you need to add an email directly to a mailbox bypassing most scanning and classification. This does not send a message.","requiredInputs":["raw"],"family":"message"},{"slug":"GOOGLESUPER_GET_CONTACTS","toolkit":"googlesuper","name":"Get contacts","description":"Fetches contacts (connections) for the authenticated Google account, allowing selection of specific data fields and pagination. Only covers saved contacts and 'Other Contacts'; email-header-only senders are out of scope. Contact records may have sparse data — handle missing fields gracefully. People API shares a per-user QPS quota; HTTP 429 requires exponential backoff (1s, 2s, 4s).","requiredInputs":[],"family":"other"},{"slug":"GOOGLESUPER_ADD_OR_REMOVE_TO_CUSTOMER_LIST","toolkit":"googlesuper","name":"Add or remove to customer list","description":"Adds or removes contacts from a Google Ads customer list (UserList/audience/remarketing list), not a Google Ads customer account. Note: It takes 6 to 12 hours for changes to be reflected in the customer list. Email addresses must comply with Google Ads policies and applicable privacy/consent laws.","requiredInputs":["emails","resource_name"],"family":"other"},{"slug":"GOOGLESUPER_ADD_PARENT","toolkit":"googlesuper","name":"Insert File Parent (v2)","description":"Tool to add a parent folder for a file using Google Drive API v2. Use when you need to add a file to an additional folder.","requiredInputs":["id","fileId"],"family":"file"},{"slug":"GOOGLESUPER_ADD_PROPERTY","toolkit":"googlesuper","name":"Insert Property (v2 API)","description":"Tool to add a property to a file, or update it if it already exists (v2 API). Use when you need to attach custom key-value metadata to a Google Drive file.","requiredInputs":["fileId","property_key","property_value"],"family":"other"},{"slug":"GOOGLESUPER_SEARCH_SPREADSHEETS","toolkit":"googlesuper","name":"Search Spreadsheets","description":"Search for Google Spreadsheets using various filters including name, content, date ranges, and more.","requiredInputs":[],"family":"other"},{"slug":"GOOGLESUPER_ADD_SHEET","toolkit":"googlesuper","name":"Add Sheet to Existing Spreadsheet","description":"Adds a new sheet to a spreadsheet. Supports three sheet types: GRID, OBJECT, and DATA_SOURCE. SHEET TYPES: - GRID (default): Standard spreadsheet with rows/columns. Use properties to set dimensions, tab color, etc. - OBJECT: Sheet containing a chart. Requires objectSheetConfig with chartSpec (basicChart or pieChart). - DATA_SOURCE: Sheet connected to BigQuery. Requires dataSourceConfig with bigQuery spec and bigquery.readonly OAuth scope. OTHER NOTES: - Sheet names must be unique; use forceUnique=true to auto-append suffix (_2, _3) if name exists - For tab colors, use EITHER rgbColor OR themeColor, not both - Avoid 'index' when creating sheets in parallel (causes errors) - OBJECT sheets are created via addChart with position.newSheet=true - DATA_SOURCE sheets require bigquery.readonly OAuth scope Use cases: Add standard grid sheet, create chart on dedicated sheet, connect to BigQuery data source.","requiredInputs":["spreadsheet_id"],"family":"sheet"},{"slug":"GOOGLESUPER_AGGREGATE_COLUMN_DATA","toolkit":"googlesuper","name":"Aggregate Column Data","description":"Searches for rows where a specific column matches a value and performs mathematical operations on data from another column.","requiredInputs":["operation","sheet_name","target_column","spreadsheet_id"],"family":"column"},{"slug":"GOOGLESUPER_APPEND_DIMENSION","toolkit":"googlesuper","name":"Append Dimension","description":"Tool to append new rows or columns to a sheet, increasing its size. Use when you need to add empty rows or columns to an existing sheet.","requiredInputs":["length","sheet_id","dimension","spreadsheet_id"],"family":"other"},{"slug":"GOOGLESUPER_AUTO_RESIZE_DIMENSIONS","toolkit":"googlesuper","name":"Auto-Resize Rows or Columns","description":"Auto-fit column widths or row heights for a dimension range using batchUpdate.autoResizeDimensions. Use when you need to automatically adjust row heights or column widths to fit content after writing data.","requiredInputs":["dimension","end_index","start_index","spreadsheet_id"],"family":"other"},{"slug":"GOOGLESUPER_BATCH_CLEAR_VALUES_BY_DATA_FILTER","toolkit":"googlesuper","name":"Batch Clear Values By Data Filter","description":"Clears one or more ranges of values from a spreadsheet using data filters. The caller must specify the spreadsheet ID and one or more DataFilters. Ranges matching any of the specified data filters will be cleared. Only values are cleared -- all other properties of the cell (such as formatting, data validation, etc..) are kept.","requiredInputs":["dataFilters","spreadsheetId"],"family":"filter"},{"slug":"GOOGLESUPER_BATCH_GET","toolkit":"googlesuper","name":"Batch get spreadsheet","description":"Retrieves data from specified cell ranges in a Google Spreadsheet.","requiredInputs":["spreadsheet_id"],"family":"spreadsheet"},{"slug":"GOOGLESUPER_BATCH_UPDATE","toolkit":"googlesuper","name":"Batch update spreadsheet (Deprecated)","description":"DEPRECATED: Use GOOGLESHEETS_VALUES_UPDATE instead. Write values to ONE range in a Google Sheet, or append as new rows if no start cell is given. IMPORTANT - This tool does NOT accept the Google Sheets API's native batch format: - WRONG: {\"data\": [{\"range\": \"...\", \"values\": [[...]]}], ...} - CORRECT: {\"sheet_name\": \"...\", \"values\": [[...]], \"first_cell_location\": \"...\", ...} To update MULTIPLE ranges, make SEPARATE CALLS to this tool for each range. Features: - Auto-expands grid for large datasets (prevents range errors) - Set first_cell_location to write at a specific position (e.g., \"A1\", \"B5\") - Omit first_cell_location to append values as new rows at the end Requirements: Target sheet must exist and spreadsheet must contain at least one worksheet.","requiredInputs":["values","sheet_name","spreadsheet_id"],"family":"spreadsheet"},{"slug":"GOOGLESUPER_BATCH_UPDATE_VALUES_BY_DATA_FILTER","toolkit":"googlesuper","name":"Batch Update Values by Data Filter","description":"Tool to update values in ranges matching data filters. Use when you need to update specific data in a Google Sheet based on criteria rather than fixed cell ranges.","requiredInputs":["data","spreadsheetId","valueInputOption"],"family":"filter"},{"slug":"GOOGLESUPER_CALENDAR_LIST_DELETE","toolkit":"googlesuper","name":"Remove Calendar from List","description":"Tool to remove a calendar from the user's calendar list. Use when you need to unsubscribe from or hide a calendar from the user's list.","requiredInputs":["calendar_id"],"family":"calendar"},{"slug":"GOOGLESUPER_CALENDAR_LIST_GET","toolkit":"googlesuper","name":"Get Single Calendar by ID","description":"Retrieves metadata for a SINGLE specific calendar from the user's calendar list by its calendar ID. This action requires a calendarId parameter and returns details about that one calendar only. NOTE: This does NOT list all calendars. To list all calendars in the user's calendar list, use GOOGLECALENDAR_CALENDAR_LIST_LIST instead.","requiredInputs":["calendarId"],"family":"calendar"},{"slug":"GOOGLESUPER_CALENDAR_LIST_PATCH","toolkit":"googlesuper","name":"Patch Calendar List Entry","description":"Updates an existing calendar on the user's calendar list using patch semantics. This method allows partial updates, modifying only the specified fields.","requiredInputs":["calendar_id"],"family":"calendar"},{"slug":"GOOGLESUPER_CALENDAR_LIST_UPDATE","toolkit":"googlesuper","name":"Update Calendar List Entry","description":"Updates a calendar list entry's display/subscription settings (color, visibility, reminders, selection) for the authenticated user — does not modify the underlying calendar resource (title, timezone, etc.). To modify the calendar itself, use GOOGLECALENDAR_CALENDARS_UPDATE.","requiredInputs":["calendar_id"],"family":"calendar"},{"slug":"GOOGLESUPER_CALENDARS_DELETE","toolkit":"googlesuper","name":"Delete Calendar","description":"Deletes a secondary calendar that you own or have delete permissions on. Deletion is permanent and irreversible — verify the correct calendar_id before calling. You cannot delete your primary calendar or calendars you only have read/write access to. Use calendarList.list to find calendars with owner accessRole. For primary calendars, use calendars.clear instead. Parallel calls may trigger userRateLimitExceeded; sequence bulk deletions.","requiredInputs":["calendar_id"],"family":"calendar"},{"slug":"GOOGLESUPER_CALENDARS_UPDATE","toolkit":"googlesuper","name":"Update Calendar","description":"Full PUT-style update that overwrites all calendar metadata fields; unspecified optional fields are cleared. Use GOOGLECALENDAR_PATCH_CALENDAR to update only a subset of fields. Mutates the underlying calendar resource (title, description, timeZone, etc.); use GOOGLECALENDAR_CALENDAR_LIST_UPDATE to change per-user display properties like color.","requiredInputs":["summary","calendarId"],"family":"calendar"},{"slug":"GOOGLESUPER_CLEAR_BASIC_FILTER","toolkit":"googlesuper","name":"Clear Basic Filter","description":"Tool to clear the basic filter from a sheet. Use when you need to remove an existing basic filter from a specific sheet within a Google Spreadsheet.","requiredInputs":["sheet_id","spreadsheet_id"],"family":"filter"},{"slug":"GOOGLESUPER_CLEAR_CALENDAR","toolkit":"googlesuper","name":"Clear Calendar","description":"Clears a primary calendar by deleting all events from it. The calendar itself is preserved; only its events are removed. Primary calendars cannot be deleted entirely.","requiredInputs":["calendar_id"],"family":"calendar"},{"slug":"GOOGLESUPER_CLEAR_VALUES","toolkit":"googlesuper","name":"Clear spreadsheet values","description":"Clears cell content (preserving formatting and notes) from a specified A1 notation range in a Google Spreadsheet; the range must correspond to an existing sheet and cells.","requiredInputs":["range","spreadsheet_id"],"family":"spreadsheet"},{"slug":"GOOGLESUPER_COPY_FILE","toolkit":"googlesuper","name":"Copy file (Deprecated)","description":"DEPRECATED: Use GOOGLEDRIVE_COPY_FILE_ADVANCED instead. Duplicates an existing file (not folders) in Google Drive by `file_id`; copy lands in same folder as original — use GOOGLEDRIVE_MOVE_FILE afterward for precise placement. Copy receives a new `file_id`; update stored references accordingly. For shared drives, requires organizer/manager rights.","requiredInputs":["file_id"],"family":"file"},{"slug":"GOOGLESUPER_COPY_FILE_ADVANCED","toolkit":"googlesuper","name":"Copy file with advanced options","description":"Creates a copy of a file and applies any requested updates with patch semantics. Use when you need to duplicate a file with advanced options like label inclusion, visibility settings, or custom metadata.","requiredInputs":["fileId"],"family":"file"},{"slug":"GOOGLESUPER_CREATE_CHART","toolkit":"googlesuper","name":"Create Chart in Google Sheets","description":"Create a chart in a Google Sheets spreadsheet using the specified data range and chart type. Conditional requirements: - Provide either a simple chart via chart_type + data_range (basicChart), OR supply a full chart_spec supporting all chart types. Exactly one approach should be used. - When using chart_spec, set exactly one of the union fields (basicChart | pieChart | bubbleChart | candlestickChart | histogramChart | waterfallChart | treemapChart | orgChart | scorecardChart).","requiredInputs":["sheet_id","chart_type","data_range","spreadsheet_id"],"family":"other"},{"slug":"GOOGLESUPER_CREATE_COMMENT","toolkit":"googlesuper","name":"Create Comment","description":"Tool to create a comment on a file in Google Drive. Returns a nested `data` object; extract `data.id` for the resulting comment identifier. Omit `anchor` and `quoted_file_content_*` for general file-level comments.","requiredInputs":["content","file_id"],"family":"comment"},{"slug":"GOOGLESUPER_CREATE_PERMISSION","toolkit":"googlesuper","name":"Create Permission","description":"Tool to create a permission for a file or shared drive. Use when you need to share a file or folder with users, groups, domains, or make it publicly accessible. **Warning:** Concurrent permissions operations on the same file are not supported; only the last update is applied.","requiredInputs":["role","type","file_id"],"family":"permission"},{"slug":"GOOGLESUPER_CREATE_REPLY","toolkit":"googlesuper","name":"Create Reply","description":"Tool to create a reply to a comment in Google Drive. Use when you need to respond to an existing comment on a file.","requiredInputs":["content","file_id","comment_id"],"family":"reply"},{"slug":"GOOGLESUPER_LIST_COMMENTS","toolkit":"googlesuper","name":"List Comments","description":"Tool to list all comments for a file in Google Drive. Results are paginated; iterate using nextPageToken until absent to retrieve all comments. Filtering by author, content, or other criteria must be done client-side. Use commentId, createdTime, and author from results to uniquely identify comments before acting on them.","requiredInputs":["fileId"],"family":"other"},{"slug":"GOOGLESUPER_CREATE_SPREADSHEET_COLUMN","toolkit":"googlesuper","name":"Create spreadsheet column","description":"Creates a new column in a Google Spreadsheet. Specify the target sheet using sheet_id (numeric) or sheet_name (text). If neither is provided, defaults to the first sheet (sheet_id=0).","requiredInputs":["spreadsheet_id"],"family":"spreadsheet"},{"slug":"GOOGLESUPER_CREATE_SPREADSHEET_ROW","toolkit":"googlesuper","name":"Create spreadsheet row","description":"Inserts a new, empty row into a specified sheet of a Google Spreadsheet at a given index, optionally inheriting formatting from the row above.","requiredInputs":["spreadsheet_id"],"family":"spreadsheet"},{"slug":"GOOGLESUPER_DELETE_CHART","toolkit":"googlesuper","name":"Delete Chart from Google Sheets","description":"Delete an existing chart from a Google Sheets spreadsheet. Use this action when you need to remove a chart that is no longer needed or needs to be replaced. This action is irreversible — once a chart is deleted, it cannot be recovered. The chart data source (the cells containing the data) remains unchanged; only the chart visualization is removed.","requiredInputs":["chart_id","spreadsheet_id"],"family":"other"},{"slug":"GOOGLESUPER_DELETE_CHILD","toolkit":"googlesuper","name":"Delete Child (v2)","description":"Tool to remove a child from a folder using Google Drive API v2. Use when you need to remove a file from a specific folder.","requiredInputs":["childId","folderId"],"family":"other"},{"slug":"GOOGLESUPER_DELETE_COMMENT","toolkit":"googlesuper","name":"Delete Comment","description":"Permanently deletes a comment thread (and all its replies) from a Google Drive file — this action is irreversible. To remove only a single reply within a thread, use GOOGLEDRIVE_DELETE_REPLY instead. Verify the exact comment content and comment_id before calling.","requiredInputs":["file_id","comment_id"],"family":"comment"},{"slug":"GOOGLESUPER_DELETE_DIMENSION","toolkit":"googlesuper","name":"Delete Dimension (Rows/Columns)","description":"Tool to delete specified rows or columns from a sheet in a Google Spreadsheet. Use when you need to remove a range of rows or columns.","requiredInputs":["spreadsheet_id"],"family":"other"},{"slug":"GOOGLESUPER_LIST_DRAFTS","toolkit":"googlesuper","name":"List Drafts","description":"Retrieves a paginated list of email drafts from a user's Gmail account. Use verbose=true to get full draft details including subject, body, sender, and timestamp. Draft ordering is non-guaranteed; iterate using page_token until it is absent to retrieve all drafts. Newly created drafts may not appear immediately. Rapid calls may trigger 403 userRateLimitExceeded or 429 errors; apply exponential backoff (1s, 2s, 4s) before retrying.","requiredInputs":[],"family":"other"},{"slug":"GOOGLESUPER_DELETE_DRAFT","toolkit":"googlesuper","name":"Delete Draft","description":"Permanently deletes a specific Gmail draft using its ID with no recovery possible; verify the correct `draft_id` and obtain explicit user confirmation before calling. Ensure the draft exists and the user has necessary permissions for the given `user_id`.","requiredInputs":["draft_id"],"family":"draft"},{"slug":"GOOGLESUPER_CREATE_EMAIL_DRAFT","toolkit":"googlesuper","name":"Create email draft","description":"Creates a Gmail email draft. While all fields are optional per the Gmail API, practical validation requires at least one of recipient_email, cc, or bcc and at least one of subject or body. Supports To/Cc/Bcc recipients, subject, plain/HTML body (ensure `is_html=True` for HTML), attachments, and threading. Returns a draft_id that must be used as-is with GMAIL_SEND_DRAFT — synthetic or stale IDs will fail. When creating a draft reply to an existing thread (thread_id provided), leave subject empty to stay in the same thread; setting a subject will create a NEW thread instead. HTTP 429 may occur on rapid creation/send sequences; apply exponential backoff.","requiredInputs":[],"family":"draft"},{"slug":"GOOGLESUPER_EVENTS_LIST_ALL_CALENDARS","toolkit":"googlesuper","name":"List Events from All Calendars","description":"Return a unified event list across all calendars in the user's calendar list for a given time range. Use when you need a single view of all events across multiple calendars. An inverted or incorrect time range silently returns empty results rather than an error. An empty `items` list means no events matched the filters—adjust `time_min`, `time_max`, or `q` before concluding no events exist.","requiredInputs":["time_max","time_min"],"family":"other"},{"slug":"GOOGLESUPER_DELETE_EVENT","toolkit":"googlesuper","name":"Delete event","description":"Deletes a specified event by `event_id` from a Google Calendar (`calendar_id`); idempotent — a 404 for an already-deleted event is a no-op. Bulk deletions may trigger `rateLimitExceeded` or `userRateLimitExceeded`; cap concurrency to 5–10 requests and apply exponential backoff.","requiredInputs":["event_id"],"family":"event"},{"slug":"GOOGLESUPER_DELETE_FILE","toolkit":"googlesuper","name":"Delete file","description":"DEPRECATED: Use GOOGLEDRIVE_GOOGLE_DRIVE_DELETE_FOLDER_OR_FILE_ACTION instead. Tool to permanently delete a file owned by the user without moving it to trash. Use when permanent deletion is required. If the file belongs to a shared drive, the user must be an organizer on the parent folder.","requiredInputs":["fileId"],"family":"file"},{"slug":"GOOGLESUPER_LIST_FILTERS","toolkit":"googlesuper","name":"List Gmail filters","description":"Tool to list all Gmail filters (rules) in the mailbox. Use for security audits to detect malicious filter rules or before creating new filters to avoid duplicates.","requiredInputs":[],"family":"other"},{"slug":"GOOGLESUPER_DELETE_FILTER","toolkit":"googlesuper","name":"Delete Gmail filter","description":"Tool to permanently delete a Gmail filter by its ID. Use when you need to remove an existing email filtering rule.","requiredInputs":["filter_id"],"family":"filter"},{"slug":"GOOGLESUPER_CREATE_FILTER","toolkit":"googlesuper","name":"Create Gmail filter","description":"Tool to create a new Gmail filter with specified criteria and actions. Use when the user wants to automatically organize incoming messages based on sender, subject, size, or other criteria. Note: you can only create a maximum of 1,000 filters per account.","requiredInputs":["action","criteria"],"family":"filter"},{"slug":"GOOGLESUPER_GET_FILTER","toolkit":"googlesuper","name":"Get Gmail filter","description":"Tool to retrieve a specific Gmail filter by its ID. Use when you need to inspect the criteria and actions of an existing filter.","requiredInputs":["id"],"family":"filter"},{"slug":"GOOGLESUPER_LIST_FILE_LABELS","toolkit":"googlesuper","name":"List File Labels","description":"Tool to list the labels already applied to a file in Google Drive. An empty labels array is a valid response indicating no labels are applied, not an error. This tool shows only applied labels; label_id and field_id values required by other Drive label tools must be obtained from admin configuration.","requiredInputs":["file_id"],"family":"file"},{"slug":"GOOGLESUPER_DELETE_LABEL","toolkit":"googlesuper","name":"Delete label from account (permanent)","description":"Permanently DELETES a user-created Gmail label from the account (not from a message). WARNING: This action DELETES the label definition itself, removing it from all messages. System labels (INBOX, SENT, UNREAD, etc.) cannot be deleted. To add/remove labels from specific messages, use GMAIL_ADD_LABEL_TO_EMAIL action instead.","requiredInputs":["label_id"],"family":"label"},{"slug":"GOOGLESUPER_LIST_LABELS","toolkit":"googlesuper","name":"List Gmail labels","description":"Retrieves all system and user-created labels for a Gmail account in a single unpaginated response. Primary use: obtain internal label IDs (e.g., 'Label_123') required by other Gmail tools — display names cannot be used as label identifiers and cause silent failures or errors. System labels (INBOX, UNREAD, SPAM, TRASH, etc.) are case-sensitive and must be used exactly as returned; INBOX, SPAM, and TRASH are read-only and cannot be added/removed via label modification tools. The Gmail search 'label:' operator accepts display names, but label_ids parameters in tools like GMAIL_FETCH_EMAILS require internal IDs from this tool — mixing conventions yields zero results silently. Do not hardcode label IDs across sessions; refresh via this tool on conflict errors.","requiredInputs":[],"family":"other"},{"slug":"GOOGLESUPER_SEARCH_DOCUMENTS","toolkit":"googlesuper","name":"Search Documents","description":"Search for Google Documents using various filters including name, content, date ranges, and more.","requiredInputs":[],"family":"other"},{"slug":"GOOGLESUPER_DELETE_MESSAGE","toolkit":"googlesuper","name":"Delete message","description":"Permanently deletes a specific email message by its ID from a Gmail mailbox; for `user_id`, use 'me' for the authenticated user or an email address to which the authenticated user has delegated access.","requiredInputs":["message_id"],"family":"message"},{"slug":"GOOGLESUPER_DELETE_PARENT","toolkit":"googlesuper","name":"Delete Parent (v2)","description":"Tool to remove a parent from a file using Google Drive API v2. Use when you need to remove a file from a specific folder.","requiredInputs":["fileId","parentId"],"family":"other"},{"slug":"GOOGLESUPER_DELETE_PERMISSION","toolkit":"googlesuper","name":"Delete Permission","description":"Deletes a permission from a file by permission ID. Deletion is irreversible — confirm the target user, group, or permission type before executing. IMPORTANT: You must first call GOOGLEDRIVE_LIST_PERMISSIONS to get valid permission IDs. To fully revoke public access, the type='anyone' (link-sharing) permission must be explicitly deleted; revoking other permissions leaves the file publicly accessible via link. Use when you need to revoke access for a specific user or group from a file.","requiredInputs":["file_id","permission_id"],"family":"permission"},{"slug":"GOOGLESUPER_DELETE_PROPERTY","toolkit":"googlesuper","name":"Delete Property (v2 API)","description":"Tool to delete a property from a file using Google Drive API v2. Use when you need to remove custom key-value metadata from a file.","requiredInputs":["fileId","propertyKey"],"family":"other"},{"slug":"GOOGLESUPER_DELETE_REPLY","toolkit":"googlesuper","name":"Delete Reply","description":"Tool to delete a specific reply by reply ID. Deletion is irreversible; obtain explicit user confirmation before calling. Removes only the targeted reply, not the full comment thread — use GOOGLEDRIVE_DELETE_COMMENT to remove the entire thread.","requiredInputs":["file_id","reply_id","comment_id"],"family":"reply"},{"slug":"GOOGLESUPER_LIST_REPLIES","toolkit":"googlesuper","name":"List Replies to Comment","description":"Tool to list replies to a comment in Google Drive. Use this when you need to retrieve all replies associated with a specific comment on a file.","requiredInputs":["file_id","comment_id"],"family":"comment"},{"slug":"GOOGLESUPER_DELETE_REVISION","toolkit":"googlesuper","name":"Delete Revision","description":"Tool to permanently delete a file revision. Use when you need to remove a specific version of a binary file (images, videos, etc.). Cannot delete revisions for Google Docs/Sheets or the last remaining revision.","requiredInputs":["file_id","revision_id"],"family":"revision"},{"slug":"GOOGLESUPER_LIST_REVISIONS","toolkit":"googlesuper","name":"List File Revisions","description":"Tool to list a file's revision metadata (not content) in Google Drive. Drive may prune old revisions, so history may be incomplete for frequently edited files. Filter client-side for specific revisionIds; do not assume the last entry is the active version.","requiredInputs":["fileId"],"family":"file"},{"slug":"GOOGLESUPER_DELETE_SHEET","toolkit":"googlesuper","name":"Delete Sheet","description":"Tool to delete a sheet (worksheet) from a spreadsheet. Use when you need to remove a specific sheet from a Google Sheet document.","requiredInputs":["sheetId","spreadsheetId"],"family":"sheet"},{"slug":"GOOGLESUPER_CREATE_TASK_LIST","toolkit":"googlesuper","name":"Create a task list","description":"Creates a new task list with the specified title and returns a tasklist_id. Use the returned tasklist_id (not the title) when calling GOOGLETASKS_INSERT_TASK or other task operations. Duplicate titles are permitted by the API, so verify existing lists before creating to avoid unintended duplicates.","requiredInputs":["tasklist_title"],"family":"task"},{"slug":"GOOGLESUPER_DELETE_TASK","toolkit":"googlesuper","name":"Delete task","description":"Deletes a specified task from a Google Tasks list. Deletion is permanent and irreversible — confirm with the user before executing, and consider GOOGLETASKS_UPDATE_TASK or GOOGLETASKS_MOVE_TASK as non-destructive alternatives. Both tasklist_id and task_id are required parameters. The Google Tasks API does not support deleting tasks by task_id alone — you must specify which task list contains the task. Use 'List Task Lists' to get available list IDs, then 'List Tasks' to find the task_id within that list.","requiredInputs":["task_id","tasklist_id"],"family":"task"},{"slug":"GOOGLESUPER_GET_TASK_LIST","toolkit":"googlesuper","name":"Get task list","description":"Retrieves a specific task list from the user's Google Tasks if the `tasklist_id` exists for the authenticated user.","requiredInputs":["tasklist_id"],"family":"task"},{"slug":"GOOGLESUPER_LIST_TASK_LISTS","toolkit":"googlesuper","name":"List task lists","description":"Fetches the authenticated user's task lists from Google Tasks; results may be paginated. Response contains task lists under the `items` key. Multiple lists may share similar names — confirm the correct list by ID before passing to other tools.","requiredInputs":[],"family":"task"},{"slug":"GOOGLESUPER_DOWNLOAD_FILE","toolkit":"googlesuper","name":"Download a file from Google Drive","description":"Downloads a file from Google Drive by its ID. For Google Workspace documents (Docs, Sheets, Slides), optionally exports to a specified `mime_type`. For other file types, downloads in their native format regardless of mime_type. Examples: Export a Google Doc to plain text: {\"file_id\": \"1N2o5xQWmAbCdEfGhIJKlmnOPq\", \"mime_type\": \"text/plain\"} Download a Google Sheet as CSV: {\"file_id\": \"1ZyXwVuTsRqPoNmLkJiHgFeDcB\", \"mime_type\": \"text/csv\"}","requiredInputs":["fileId"],"family":"file"},{"slug":"GOOGLESUPER_DOWNLOAD_FILE2","toolkit":"googlesuper","name":"Download file content (Deprecated)","description":"DEPRECATED: Use GOOGLEDRIVE_DOWNLOAD_FILE_OPERATION instead. Tool to download file content as a long-running operation. Use when you need to download files from Google Drive. Operations are valid for 24 hours from the time of creation.","requiredInputs":["file_id"],"family":"file"},{"slug":"GOOGLESUPER_DOWNLOAD_FILE_OPERATION","toolkit":"googlesuper","name":"Download file via operation","description":"Tool to download file content using long-running operations. Use when you need to download Google Vids files or export Google Workspace documents as part of a long-running operation. Operations are valid for 24 hours from creation. Returns a response containing `downloaded_file_content.s3url` — a short-lived S3 URL; fetch the actual file bytes from that URL promptly after the call.","requiredInputs":["file_id"],"family":"file"},{"slug":"GOOGLESUPER_EDIT_FILE","toolkit":"googlesuper","name":"Edit File","description":"Updates an existing Google Drive file with binary content by overwriting its entire content with new text (max 10MB). IMPORTANT: This action only works with files that have binary content (text files, PDFs, images, etc.). It does NOT support editing Google Workspace native files (Google Docs, Sheets, Slides, etc.). For Google Workspace files, use the Google Docs API, Google Sheets API, or Google Slides API directly. Preserves the original file_id (unlike GOOGLEDRIVE_UPLOAD_FILE which creates a new ID).","requiredInputs":["content","file_id"],"family":"file"},{"slug":"GOOGLESUPER_EVENTS_GET","toolkit":"googlesuper","name":"Get Event","description":"Retrieves a SINGLE event by its unique event_id (REQUIRED). This action does NOT list or search events - it fetches ONE specific event when you already know its ID. If you want to list events within a time range, search for events, or filter by criteria like time_min/time_max, use GOOGLECALENDAR_EVENTS_LIST instead.","requiredInputs":["event_id"],"family":"event"},{"slug":"GOOGLESUPER_EVENTS_INSTANCES","toolkit":"googlesuper","name":"Get Event Instances","description":"Returns instances of the specified recurring event. Use timeMin/timeMax to constrain the window; omitting bounds can return large result sets and is quota-heavy. On high-volume calls, 403 rateLimitExceeded or 429 too_many_requests may occur; apply exponential backoff (1s, 2s, 4s) before retrying.","requiredInputs":["eventId","calendarId"],"family":"event"},{"slug":"GOOGLESUPER_EVENTS_MOVE","toolkit":"googlesuper","name":"Move Event","description":"Moves an event to another calendar, i.e., changes an event's organizer.","requiredInputs":["event_id","calendar_id","destination"],"family":"event"},{"slug":"GOOGLESUPER_EVENTS_WATCH","toolkit":"googlesuper","name":"Watch Events","description":"Watch for changes to Events resources. Watch channels expire; persist the channel `id` per `calendarId` to re-establish watches after expiration or restarts.","requiredInputs":["id","address","calendarId"],"family":"other"},{"slug":"GOOGLESUPER_EXECUTE_SQL","toolkit":"googlesuper","name":"Execute SQL on Spreadsheet","description":"DEPRECATED: Use direct Google Sheets actions instead: - GOOGLESHEETS_VALUES_GET / GOOGLESHEETS_BATCH_GET for reads - GOOGLESHEETS_VALUES_UPDATE / GOOGLESHEETS_UPDATE_VALUES_BATCH / GOOGLESHEETS_SPREADSHEETS_VALUES_APPEND for writes Execute SQL queries against Google Sheets tables. Supports SELECT, INSERT, UPDATE, DELETE operations and WITH clauses (CTEs) with familiar SQL syntax. Tables are automatically detected and mapped from the spreadsheet structure.","requiredInputs":["sql","spreadsheet_id"],"family":"spreadsheet"},{"slug":"GOOGLESUPER_EXPORT_DOCUMENT_AS_PDF","toolkit":"googlesuper","name":"Export Google Doc as PDF","description":"Tool to export a Google Docs file as PDF using the Google Drive API. Use when you need to generate a PDF version of a Google Docs document for download or distribution. Note: Google Drive enforces a 10MB limit on export content.","requiredInputs":["file_id"],"family":"document"},{"slug":"GOOGLESUPER_EXPORT_GOOGLE_WORKSPACE_FILE","toolkit":"googlesuper","name":"Export Google Workspace file","description":"Exports a Google Workspace document to the requested MIME type and returns exported file content. Use when you need to export Google Docs, Sheets, Slides, Drawings, or Apps Script files to a specific format. Note: The exported content is limited to 10MB by Google Drive API.","requiredInputs":["fileId","mimeType"],"family":"file"},{"slug":"GOOGLESUPER_FETCH_MESSAGE_BY_MESSAGE_ID","toolkit":"googlesuper","name":"Fetch message by message ID","description":"Fetches a specific email message by its ID, provided the `message_id` exists and is accessible to the authenticated `user_id`. Spam/trash messages are excluded unless upstream list/search calls used `include_spam_trash=true`. Use `internalDate` (milliseconds since epoch) rather than header `Date` for recency checks.","requiredInputs":["message_id"],"family":"message"},{"slug":"GOOGLESUPER_LIST_THREADS","toolkit":"googlesuper","name":"List threads","description":"Retrieves a list of email threads from a Gmail account, identified by `user_id` (email address or 'me'), supporting filtering and pagination. Spam and trash are excluded by default unless explicitly targeted via `label:spam` or `label:trash` in the query.","requiredInputs":[],"family":"other"},{"slug":"GOOGLESUPER_FETCH_MESSAGE_BY_THREAD_ID","toolkit":"googlesuper","name":"Fetch Message by Thread ID","description":"Retrieves messages from a Gmail thread using its `thread_id`, where the thread must be accessible by the specified `user_id`. Returns a `messages` array; `thread_id` is not echoed in the response. Message order is not guaranteed — sort by `internalDate` to find oldest/newest. Check `labelIds` per message to filter drafts. Concurrent bulk calls may trigger 403 `userRateLimitExceeded` or 429; cap concurrency ~10 and use exponential backoff.","requiredInputs":["thread_id"],"family":"message"},{"slug":"GOOGLESUPER_FIND_REPLACE","toolkit":"googlesuper","name":"Find and Replace in Spreadsheet","description":"Tool to find and replace text in a Google Spreadsheet. Use when you need to fix formula errors, update values, or perform bulk text replacements across cells. Common use cases: - Fix #ERROR! cells by replacing with empty string or correct formula - Update old values with new ones across multiple cells - Fix formula references or patterns - Clean up data formatting issues","requiredInputs":["find","replace","spreadsheetId"],"family":"spreadsheet"},{"slug":"GOOGLESUPER_FIND_WORKSHEET_BY_TITLE","toolkit":"googlesuper","name":"Find worksheet by title (Deprecated)","description":"DEPRECATED: Use GetSpreadsheetInfo instead. Finds a worksheet by its exact, case-sensitive title within a Google Spreadsheet; returns a boolean indicating if found and the matched worksheet's metadata when found, or None when not found.","requiredInputs":["spreadsheet_id","worksheet_title"],"family":"other"},{"slug":"GOOGLESUPER_FORMAT_CELL","toolkit":"googlesuper","name":"Format cell","description":"Applies text and background cell formatting to a specified range in a Google Sheets worksheet.","requiredInputs":["spreadsheet_id"],"family":"other"},{"slug":"GOOGLESUPER_FORWARD_MESSAGE","toolkit":"googlesuper","name":"Forward email message","description":"Forward an existing Gmail message to specified recipients, preserving original body and attachments. Verify recipients and content before forwarding to avoid unintended exposure. Bulk forwarding may trigger 429/5xx rate limits; keep concurrency to 5–10 and apply backoff. Messages near Gmail's size limits may fail; reconstruct a smaller draft if needed.","requiredInputs":["message_id","recipients"],"family":"message"},{"slug":"GOOGLESUPER_GET_ATTACHMENT","toolkit":"googlesuper","name":"Get Gmail attachment","description":"Retrieves a specific attachment by ID from a message in a user's Gmail mailbox, requiring valid message and attachment IDs. Returns the downloaded file with its MIME type and filename. Attachments exceeding ~25 MB may be exposed as Google Drive links — use GOOGLEDRIVE_DOWNLOAD_FILE when a Drive file_id is present instead.","requiredInputs":["file_name","message_id","attachment_id"],"family":"attachment"},{"slug":"GOOGLESUPER_GET_BATCH_VALUES","toolkit":"googlesuper","name":"Batch Get Spreadsheet Values (Deprecated)","description":"DEPRECATED: Use GOOGLESHEETS_BATCH_GET instead. Tool to return one or more ranges of values from a spreadsheet. Use when you need to retrieve data from multiple ranges in a single request.","requiredInputs":["ranges","spreadsheet_id"],"family":"spreadsheet"},{"slug":"GOOGLESUPER_GET_CHILD","toolkit":"googlesuper","name":"Get Child Reference (v2)","description":"Tool to get a specific child reference for a folder using Drive API v2. Use when you need to verify a specific file exists as a child of a folder.","requiredInputs":["childId","folderId"],"family":"other"},{"slug":"GOOGLESUPER_GET_COMMENT","toolkit":"googlesuper","name":"Get Comment","description":"Tool to get a comment by ID. Use when you need to retrieve a specific comment from a Google Drive file and have both the file ID and comment ID.","requiredInputs":["fileId","commentId"],"family":"comment"},{"slug":"GOOGLESUPER_GET_CONDITIONAL_FORMAT_RULES","toolkit":"googlesuper","name":"Get conditional format rules","description":"List conditional formatting rules for each sheet (or a selected sheet) in a normalized, easy-to-edit form. Use when you need to view, audit, or prepare to modify conditional format rules.","requiredInputs":["spreadsheet_id"],"family":"other"},{"slug":"GOOGLESUPER_GET_DATA_VALIDATION_RULES","toolkit":"googlesuper","name":"Get Data Validation Rules","description":"Tool to extract data validation rules from a Google Sheets spreadsheet. Use when you need to understand dropdown lists, allowed values, custom formulas, or other validation constraints for cells.","requiredInputs":["spreadsheetId"],"family":"other"},{"slug":"GOOGLESUPER_GET_DRAFT","toolkit":"googlesuper","name":"Get Draft","description":"Retrieves a single Gmail draft by its ID. Use this to fetch and inspect draft content before sending via GMAIL_SEND_DRAFT. The format parameter controls the level of detail returned.","requiredInputs":["draft_id"],"family":"draft"},{"slug":"GOOGLESUPER_GET_FILE_METADATA","toolkit":"googlesuper","name":"Get File Metadata","description":"Tool to get a file's metadata by ID. Use to verify `mimeType`, `parents`, and `trashed` status before destructive operations (delete/move/export), or to confirm `mimeType='application/vnd.google-apps.document'` before calling GOOGLEDOCS_* tools (non-native files require GOOGLEDRIVE_DOWNLOAD_FILE). Only returns metadata visible to the connected account; public access requires GOOGLEDRIVE_ADD_FILE_SHARING_PREFERENCE. High-frequency calls risk `403 rateLimitExceeded`; apply exponential backoff.","requiredInputs":["fileId"],"family":"file"},{"slug":"GOOGLESUPER_GET_FILE_PROPERTY","toolkit":"googlesuper","name":"Get Property (v2)","description":"Tool to get a property by its key using Google Drive API v2. Use when you need to retrieve a specific custom property attached to a file.","requiredInputs":["fileId","propertyKey"],"family":"file"},{"slug":"GOOGLESUPER_GET_FILE_V2","toolkit":"googlesuper","name":"Get File (v2 API) (Deprecated)","description":"DEPRECATED: Use GetFileMetadata instead. Tool to get a file's metadata or content by ID from Google Drive API v2. Use when you need file metadata with alt=json, or file content with alt=media.","requiredInputs":["fileId"],"family":"file"},{"slug":"GOOGLESUPER_GET_PARENT","toolkit":"googlesuper","name":"Get Parent Reference (v2)","description":"Tool to get a specific parent reference for a file using Drive API v2. Use when you need to retrieve information about a specific parent folder of a file.","requiredInputs":["fileId","parentId"],"family":"other"},{"slug":"GOOGLESUPER_GET_PERMISSION","toolkit":"googlesuper","name":"Get Permission","description":"Gets a permission by ID. Use this tool to retrieve a specific permission for a file or shared drive. Newly created or updated permissions on shared drives may have a brief propagation delay before appearing.","requiredInputs":["file_id","permission_id"],"family":"permission"},{"slug":"GOOGLESUPER_GET_REPLY","toolkit":"googlesuper","name":"Get Reply","description":"Tool to get a specific reply to a comment on a file. Use when you need to retrieve the details of a particular reply.","requiredInputs":["fileId","replyId","commentId"],"family":"reply"},{"slug":"GOOGLESUPER_GET_REVISION","toolkit":"googlesuper","name":"Get Revision","description":"Tool to get a specific revision's metadata (name, modifiedTime, keepForever, etc.) by revision ID. Returns metadata only — not file content. Use a separate download tool to retrieve file content or restore a revision.","requiredInputs":["file_id","revision_id"],"family":"revision"},{"slug":"GOOGLESUPER_GET_SHEET_NAMES","toolkit":"googlesuper","name":"Get sheet names","description":"Lists all worksheet names from a specified Google Spreadsheet (which must exist), useful for discovering sheets before further operations.","requiredInputs":["spreadsheet_id"],"family":"sheet"},{"slug":"GOOGLESUPER_GET_SPREADSHEET_BY_DATA_FILTER","toolkit":"googlesuper","name":"Get Spreadsheet by Data Filter","description":"Returns the spreadsheet at the given ID, filtered by the specified data filters. Use this tool when you need to retrieve specific subsets of data from a Google Sheet based on criteria like A1 notation, developer metadata, or grid ranges. Important: This action is designed for filtered data retrieval. While it accepts empty filters and returns full metadata in that case, GOOGLESHEETS_GET_SPREADSHEET_INFO is the recommended action for unfiltered spreadsheet retrieval.","requiredInputs":["spreadsheetId"],"family":"spreadsheet"},{"slug":"GOOGLESUPER_GET_TABLE_SCHEMA","toolkit":"googlesuper","name":"Get Table Schema","description":"DEPRECATED: Use GOOGLESHEETS_GET_SHEET_NAMES and GOOGLESHEETS_GET_SPREADSHEET_INFO for sheet structure metadata, and GOOGLESHEETS_VALUES_GET for direct range inspection. This action is used to get the schema of a table in a Google Spreadsheet, call this action to get the schema of a table in a spreadsheet BEFORE YOU QUERY THE TABLE. Analyze table structure and infer column names, types, and constraints. Uses statistical analysis of sample data to determine the most likely data type for each column. Call this action after calling the LIST_TABLES action to get the schema of a table in a spreadsheet.","requiredInputs":["table_name","spreadsheet_id"],"family":"other"},{"slug":"GOOGLESUPER_GET_TASK","toolkit":"googlesuper","name":"Get Task","description":"Retrieve a specific Google Task. REQUIRES both `tasklist_id` and `task_id`. Tasks cannot be retrieved by ID alone - you must always specify which task list contains the task. Use this to refresh task details before display or edits rather than relying on potentially stale results from GOOGLETASKS_LIST_TASKS.","requiredInputs":["task_id","tasklist_id"],"family":"task"},{"slug":"GOOGLESUPER_GOOGLE_DRIVE_DELETE_FOLDER_OR_FILE_ACTION","toolkit":"googlesuper","name":"Delete folder or file","description":"Tool to delete a file or folder in Google Drive. Use when you need to permanently remove a specific file or folder using its ID. Note: This action is irreversible. Deleting a folder permanently removes all nested files and subfolders.","requiredInputs":["fileId"],"family":"file"},{"slug":"GOOGLESUPER_INSERT_CHILD","toolkit":"googlesuper","name":"Insert Child Into Folder (v2)","description":"Tool to insert a file into a folder using Drive API v2. Use when you need to add an existing file to a folder.","requiredInputs":["id","folderId"],"family":"file"},{"slug":"GOOGLESUPER_INSERT_DIMENSION","toolkit":"googlesuper","name":"Insert Dimension in Google Sheet","description":"Tool to insert new rows or columns into a sheet at a specified location. Use when you need to add empty rows or columns within an existing Google Sheet.","requiredInputs":["spreadsheet_id","insert_dimension"],"family":"sheet"},{"slug":"GOOGLESUPER_LIST_ACCESS_PROPOSALS","toolkit":"googlesuper","name":"List Access Proposals","description":"Tool to list pending access proposals on a file. Use when you need to retrieve access proposals for a specific file. Note: Only approvers can list access proposals; non-approvers will receive a 403 error.","requiredInputs":["fileId"],"family":"other"},{"slug":"GOOGLESUPER_LIST_APPROVALS","toolkit":"googlesuper","name":"List Approvals","description":"Tool to list approvals on a file for workflow-based access control. Use when you need to retrieve all approvals associated with a specific file in Google Drive.","requiredInputs":["fileId"],"family":"other"},{"slug":"GOOGLESUPER_LIST_CHARTS","toolkit":"googlesuper","name":"List Charts in Google Sheets","description":"Lists all charts in a Google Sheets spreadsheet across all sheets, returning chart_id, sheet metadata, chart type, title, and position. Use this action when you need to discover what charts exist in a spreadsheet, retrieve chart IDs for update or delete operations, or inspect chart configurations. The default field mask in GOOGLESHEETS_GET_SPREADSHEET_INFO omits chart data, making this dedicated action necessary for chart discovery.","requiredInputs":["spreadsheet_id"],"family":"other"},{"slug":"GOOGLESUPER_LIST_CHILDREN_V2","toolkit":"googlesuper","name":"List Folder Children (v2)","description":"Tool to list a folder's children using Google Drive API v2. Use when you need to retrieve all files and folders within a specific folder.","requiredInputs":["folderId"],"family":"file"},{"slug":"GOOGLESUPER_LIST_FILE_PROPERTIES","toolkit":"googlesuper","name":"List Properties (v2 API)","description":"Tool to list a file's properties in Google Drive API v2. Use when you need to retrieve custom properties (key-value pairs) attached to a file.","requiredInputs":["fileId"],"family":"file"},{"slug":"GOOGLESUPER_LIST_PERMISSIONS","toolkit":"googlesuper","name":"List Permissions","description":"Tool to list a file's permissions. Use when you need to retrieve all permissions associated with a specific file or shared drive.","requiredInputs":["fileId"],"family":"other"},{"slug":"GOOGLESUPER_LIST_SPREADSHEET_CHARTS","toolkit":"googlesuper","name":"Get Charts from Spreadsheet","description":"Tool to retrieve a list of all charts from a specified Google Sheets spreadsheet. Use when you need to get chart IDs and their specifications for embedding or referencing elsewhere, such as in Google Docs.","requiredInputs":["spreadsheet_id"],"family":"spreadsheet"},{"slug":"GOOGLESUPER_LIST_TABLES","toolkit":"googlesuper","name":"List Tables in Spreadsheet","description":"DEPRECATED: Use GOOGLESHEETS_GET_SHEET_NAMES for tab discovery and GOOGLESHEETS_GET_SPREADSHEET_INFO for full sheet metadata. This action is used to list all tables in a Google Spreadsheet, call this action to get the list of tables in a spreadsheet. Discover all tables in a Google Spreadsheet by analyzing sheet structure and detecting data patterns. Uses heuristic analysis to find header rows, data boundaries, and table structures.","requiredInputs":["spreadsheet_id"],"family":"spreadsheet"},{"slug":"GOOGLESUPER_LOOKUP_SPREADSHEET_ROW","toolkit":"googlesuper","name":"Look up spreadsheet row","description":"Finds the first row in a Google Spreadsheet where a cell's entire content exactly matches the query string, searching within a specified A1 notation range or the first sheet by default.","requiredInputs":["query","spreadsheet_id"],"family":"spreadsheet"},{"slug":"GOOGLESUPER_MODIFY_FILE_LABELS","toolkit":"googlesuper","name":"Modify File Labels","description":"Modifies the set of labels applied to a file. Returns a list of the labels that were added or modified. Use when you need to programmatically change labels on a Google Drive file, such as adding, updating, or removing them.","requiredInputs":["file_id","label_modifications"],"family":"file"},{"slug":"GOOGLESUPER_MODIFY_THREAD_LABELS","toolkit":"googlesuper","name":"Modify thread labels","description":"Adds or removes specified existing label IDs from a Gmail thread, affecting all its messages; ensure the thread ID is valid. To modify a single message only, use a message-level tool instead.","requiredInputs":["thread_id"],"family":"thread"},{"slug":"GOOGLESUPER_MOVE_CHART","toolkit":"googlesuper","name":"Move or Resize Chart in Google Sheets","description":"Move or resize an existing chart on a Google Sheets spreadsheet. Use this action when you need to reposition a chart to a different location on the same or different sheet, move it to a brand-new sheet, or change its size. This action wraps the updateEmbeddedObjectPosition batchUpdate request type and supports three positioning modes: moving to a new sheet, moving to an existing sheet, or repositioning via pixel-perfect overlay coordinates.","requiredInputs":["chart_id","spreadsheet_id"],"family":"other"},{"slug":"GOOGLESUPER_MOVE_FILE","toolkit":"googlesuper","name":"Move File","description":"Tool to move a file from one folder to another in Google Drive. To truly move (not just copy the parent), always provide both `add_parents` (destination folder ID) and `remove_parents` (source folder ID); omitting `remove_parents` leaves the file in multiple folders. Useful for reorganizing files, including newly created Google Docs/Sheets that default to Drive root.","requiredInputs":["file_id"],"family":"file"},{"slug":"GOOGLESUPER_MOVE_THREAD_TO_TRASH","toolkit":"googlesuper","name":"Trash thread","description":"Moves the specified thread to the trash. Any messages that belong to the thread are also moved to the trash.","requiredInputs":["thread_id"],"family":"thread"},{"slug":"GOOGLESUPER_MOVE_TO_TRASH","toolkit":"googlesuper","name":"Move to Trash","description":"Moves an existing, non-deleted email message to the trash for the specified user. Trashed messages are recoverable and still count toward storage quota until purged. Prefer this over GMAIL_BATCH_DELETE_MESSAGES when recovery may be needed. For bulk operations, use GMAIL_BATCH_MODIFY_MESSAGES or GMAIL_BATCH_DELETE_MESSAGES instead of repeated calls to this tool.","requiredInputs":["message_id"],"family":"other"},{"slug":"GOOGLESUPER_MUTATE_CONDITIONAL_FORMAT_RULES","toolkit":"googlesuper","name":"Mutate conditional format rules","description":"Add, update, delete, or reorder conditional format rules on a Google Sheet. Use when you need to create, modify, or remove conditional formatting without manually building batchUpdate requests. Supports four operations: ADD (create new rule), UPDATE (replace existing rule), DELETE (remove rule), MOVE (reorder rules by changing index).","requiredInputs":["sheet_id","operation","spreadsheet_id"],"family":"other"},{"slug":"GOOGLESUPER_PARSE_FILE","toolkit":"googlesuper","name":"Export or download a file","description":"DEPRECATED: Exports Google Workspace files (max 10MB) to a specified format using `mime_type`, or downloads other file types; use `GOOGLEDRIVE_DOWNLOAD_FILE` instead.","requiredInputs":["file_id"],"family":"file"},{"slug":"GOOGLESUPER_PATCH_CALENDAR","toolkit":"googlesuper","name":"Patch Calendar","description":"Partially updates (PATCHes) an existing Google Calendar, modifying only the fields provided. At least one of summary, description, location, or timezone must be provided. Empty strings for `description` or `location` clear them.","requiredInputs":["calendar_id"],"family":"calendar"},{"slug":"GOOGLESUPER_PATCH_EVENT","toolkit":"googlesuper","name":"Patch Event","description":"Update specified fields of an existing event in a Google Calendar using patch semantics (array fields like `attendees` are fully replaced if provided); ensure the `calendar_id` and `event_id` are valid and the user has write access to the calendar.","requiredInputs":["event_id","calendar_id"],"family":"event"},{"slug":"GOOGLESUPER_PATCH_PERMISSION","toolkit":"googlesuper","name":"Patch Permission","description":"Tool to update a permission using patch semantics. Use when you need to modify specific fields of an existing permission without affecting other fields. **Warning:** Concurrent permissions operations on the same file are not supported; only the last update is applied.","requiredInputs":["file_id","permission_id"],"family":"permission"},{"slug":"GOOGLESUPER_PATCH_PROPERTY","toolkit":"googlesuper","name":"Patch Property (v2 API)","description":"Tool to update a property on a file using PATCH semantics (v2 API). Use when you need to partially update custom key-value metadata attached to a Google Drive file.","requiredInputs":["fileId","propertyKey"],"family":"other"},{"slug":"GOOGLESUPER_PATCH_TASK","toolkit":"googlesuper","name":"Patch Task","description":"Partially updates an existing task (identified by `task_id`) within a specific Google Task list (identified by `tasklist_id`), modifying only the provided attributes from `TaskInput` (e.g., `title`, `notes`, `due` date, `status`) and requiring both the task and list to exist.","requiredInputs":["task_id","tasklist_id"],"family":"task"},{"slug":"GOOGLESUPER_QUERY_TABLE","toolkit":"googlesuper","name":"Query Spreadsheet Table","description":"DEPRECATED: Use GOOGLESHEETS_VALUES_GET / GOOGLESHEETS_BATCH_GET for table reads and GOOGLESHEETS_LOOKUP_SPREADSHEET_ROW for row lookup/filter workflows. Execute SQL-like SELECT queries against Google Spreadsheet tables. Table names correspond to sheet/tab names visible at the bottom of the spreadsheet. Use GOOGLESHEETS_LIST_TABLES first to discover available table names if unknown. Supports WHERE conditions, ORDER BY, LIMIT clauses.","requiredInputs":["sql","spreadsheet_id"],"family":"spreadsheet"},{"slug":"GOOGLESUPER_REMOVE_ATTENDEE","toolkit":"googlesuper","name":"Remove attendee from event","description":"Removes an attendee from a specified event in a Google Calendar; the calendar and event must exist. Concurrent calls on the same event can overwrite attendee lists — apply changes sequentially per event.","requiredInputs":["event_id","attendee_email"],"family":"event"},{"slug":"GOOGLESUPER_REMOVE_LABEL","toolkit":"googlesuper","name":"Remove label (Deprecated)","description":"DEPRECATED: Use GMAIL_DELETE_LABEL instead. Permanently deletes a specific, existing user-created Gmail label by its ID for a user; cannot delete system labels.","requiredInputs":["label_id"],"family":"label"},{"slug":"GOOGLESUPER_REPLY_TO_THREAD","toolkit":"googlesuper","name":"Reply to email thread","description":"Sends a reply within a specific Gmail thread using the original thread's subject; do not provide a custom subject as it will start a new conversation instead of replying in-thread. Requires a valid `thread_id` and at least one of `recipient_email`, `cc`, or `bcc`. Supports optional file attachments.","requiredInputs":["thread_id"],"family":"reply"},{"slug":"GOOGLESUPER_SEARCH_DEVELOPER_METADATA","toolkit":"googlesuper","name":"Search Developer Metadata","description":"Tool to search for developer metadata in a spreadsheet. Use when you need to find specific metadata entries based on filters.","requiredInputs":["dataFilters","spreadsheetId"],"family":"other"},{"slug":"GOOGLESUPER_SEND_DRAFT","toolkit":"googlesuper","name":"Send Draft","description":"Sends an existing draft email AS-IS to recipients already defined within the draft. IMPORTANT: This action does NOT accept recipient parameters (to, cc, bcc). The Gmail API's drafts/send endpoint sends drafts to whatever recipients are already set in the draft's To, Cc, and Bcc headers - it cannot add or override recipients. If the draft has no recipients, you must either: 1. Create a new draft with recipients using GMAIL_CREATE_EMAIL_DRAFT, then send it 2. Use GMAIL_SEND_EMAIL to send a new email directly with recipients. Send is immediate and irreversible — confirm recipients and content before calling. No scheduling support; trigger at the desired UTC time externally. Gmail enforces ~25 MB message size limit and daily send caps (~500 recipients/day personal, ~2,000/day Workspace).","requiredInputs":["draft_id"],"family":"draft"},{"slug":"GOOGLESUPER_SET_BASIC_FILTER","toolkit":"googlesuper","name":"Set Basic Filter","description":"Tool to set a basic filter on a sheet in a Google Spreadsheet. Use when you need to filter or sort data within a specific range on a sheet.","requiredInputs":["filter","spreadsheetId"],"family":"filter"},{"slug":"GOOGLESUPER_SET_DATA_VALIDATION_RULE","toolkit":"googlesuper","name":"Set Data Validation Rule","description":"Tool to set or clear data validation rules (including dropdowns) on a range in Google Sheets. Use when you need to apply dropdown lists, range-based dropdowns, or custom formula validation to cells.","requiredInputs":["mode","sheet_id","end_row_index","spreadsheet_id","start_row_index","end_column_index","start_column_index"],"family":"rule"},{"slug":"GOOGLESUPER_SORT_RANGE","toolkit":"googlesuper","name":"Sort Range","description":"Sorts data within a specified range in a Google Sheet based on one or more sort criteria. Use this action when you need to reorder rows in a range by column values, with support for multi-level (cascading) sorts.","requiredInputs":["range","sortSpecs","spreadsheet_id"],"family":"other"},{"slug":"GOOGLESUPER_SPREADSHEETS_SHEETS_COPY_TO","toolkit":"googlesuper","name":"Copy Sheet to Another Spreadsheet","description":"Tool to copy a single sheet from a spreadsheet to another spreadsheet. Use when you need to duplicate a sheet into a different spreadsheet.","requiredInputs":["sheet_id","spreadsheet_id","destination_spreadsheet_id"],"family":"sheet"},{"slug":"GOOGLESUPER_SPREADSHEETS_VALUES_APPEND","toolkit":"googlesuper","name":"Append Values to Spreadsheet","description":"Tool to append values to a spreadsheet. Use when you need to add new data to the end of an existing table in a Google Sheet.","requiredInputs":["range","values","spreadsheetId","valueInputOption"],"family":"spreadsheet"},{"slug":"GOOGLESUPER_SPREADSHEETS_VALUES_BATCH_CLEAR","toolkit":"googlesuper","name":"Batch Clear Spreadsheet Values","description":"Tool to clear one or more ranges of values from a spreadsheet. Use when you need to remove data from specific cells or ranges while keeping formatting and other properties intact.","requiredInputs":["ranges","spreadsheet_id"],"family":"spreadsheet"},{"slug":"GOOGLESUPER_SPREADSHEETS_VALUES_BATCH_GET_BY_DATA_FILTER","toolkit":"googlesuper","name":"Batch Get Spreadsheet Values by Data Filter","description":"Tool to return one or more ranges of values from a spreadsheet that match the specified data filters. Use when you need to retrieve specific data sets based on filtering criteria rather than entire sheets or fixed ranges.","requiredInputs":["dataFilters","spreadsheetId"],"family":"filter"},{"slug":"GOOGLESUPER_TRASH_FILE","toolkit":"googlesuper","name":"Trash File","description":"Tool to move a file or folder to trash (soft delete). Use when you need to delete a file but want to allow recovery via UNTRASH_FILE. This action is distinct from permanent deletion and provides a safer cleanup workflow.","requiredInputs":["file_id"],"family":"file"},{"slug":"GOOGLESUPER_UNTRASH_FILE","toolkit":"googlesuper","name":"Untrash File","description":"Tool to restore a file from the trash. Use when you need to recover a deleted file. This action updates the file's metadata to set the 'trashed' property to false. Only works while the file remains in trash — recovery is impossible after trash is emptied via GOOGLEDRIVE_EMPTY_TRASH or auto-purged by policy.","requiredInputs":["file_id"],"family":"file"},{"slug":"GOOGLESUPER_UNTRASH_MESSAGE","toolkit":"googlesuper","name":"Untrash Message","description":"Tool to remove a message from trash in Gmail. Use when you need to restore a previously trashed email message.","requiredInputs":["message_id"],"family":"message"},{"slug":"GOOGLESUPER_UNTRASH_THREAD","toolkit":"googlesuper","name":"Untrash thread","description":"Tool to remove a thread from trash in Gmail. Use when you need to restore a deleted thread and its messages.","requiredInputs":["thread_id"],"family":"thread"},{"slug":"GOOGLESUPER_UPDATE_CHART","toolkit":"googlesuper","name":"Update Chart in Google Sheets","description":"Update the specification of an existing chart in a Google Sheets spreadsheet. Use this action when you need to modify an existing chart's properties such as its title, chart type, data ranges, colors, axes, or other visual settings. This action updates the chart's specification but does not change its position or size on the sheet.","requiredInputs":["chart_id","chart_spec","spreadsheet_id"],"family":"other"},{"slug":"GOOGLESUPER_UPDATE_COMMENT","toolkit":"googlesuper","name":"Update Comment","description":"Tool to update an existing comment on a Google Drive file. Use when you need to change the content of a comment. NOTE: The 'resolved' field is read-only in the Google Drive API. To resolve or reopen a comment, use CREATE_REPLY with action='resolve' or action='reopen'.","requiredInputs":["file_id","comment_id"],"family":"comment"},{"slug":"GOOGLESUPER_UPDATE_DIMENSION_PROPERTIES","toolkit":"googlesuper","name":"Update Dimension Properties (Hide/Unhide & Resize)","description":"Tool to hide/unhide rows or columns and set row heights or column widths. Use when you need to change visibility or pixel sizing of dimensions in a Google Sheet.","requiredInputs":["dimension","end_index","start_index","spreadsheet_id"],"family":"other"},{"slug":"GOOGLESUPER_UPDATE_DRAFT","toolkit":"googlesuper","name":"Update draft","description":"Updates (replaces) an existing Gmail draft's content in-place by draft ID. This action replaces the entire draft content with the new message - it does not patch individual fields. All fields are optional; if not provided, you should provide complete draft content to avoid data loss.","requiredInputs":["draft_id"],"family":"draft"},{"slug":"GOOGLESUPER_UPDATE_EVENT","toolkit":"googlesuper","name":"Update Google event","description":"Updates an existing event in Google Calendar. REQUIRES event_id - you MUST first search for the event using GOOGLECALENDAR_FIND_EVENT or GOOGLECALENDAR_EVENTS_LIST to obtain the event_id. This is a full PUT replacement: omitted fields (including attendees, reminders, recurrence, conferencing) are cleared. Always provide the complete desired event state. Use GOOGLECALENDAR_PATCH_EVENT instead for partial edits.","requiredInputs":["event_id","start_datetime"],"family":"event"},{"slug":"GOOGLESUPER_UPDATE_FILE_METADATA_PATCH","toolkit":"googlesuper","name":"Update File Metadata (PATCH v2)","description":"Tool to update file metadata using the Drive API v2 PATCH method. Use when you need to modify file properties like title, description, or labels using patch semantics.","requiredInputs":["fileId"],"family":"file"},{"slug":"GOOGLESUPER_UPDATE_FILE_PROPERTY","toolkit":"googlesuper","name":"Update Property (v2 API)","description":"Tool to update a property on a file using Google Drive API v2. Use when you need to modify an existing custom property attached to a file.","requiredInputs":["fileId","propertyKey"],"family":"file"},{"slug":"GOOGLESUPER_UPDATE_FILE_PUT","toolkit":"googlesuper","name":"Update File (Metadata)","description":"Updates file metadata. Uses PATCH semantics (partial update) as per Google Drive API v3 — only explicitly provided fields are updated, so omit fields you do not intend to overwrite. Use this tool to modify attributes of an existing file like its name, description, or parent folders. To move a file, supply add_parents and remove_parents together; omitting remove_parents creates multiple parents, omitting add_parents can orphan the file. Bulk updates may trigger 429 Too Many Requests; apply exponential backoff. Note: supports metadata updates only; file content updates are not yet implemented.","requiredInputs":["fileId"],"family":"file"},{"slug":"GOOGLESUPER_UPDATE_FILE_REVISION_METADATA","toolkit":"googlesuper","name":"Update File Revision Metadata","description":"Updates ONLY the metadata properties of a specific file revision (keepForeve
