ll reactions (emoji responses) made to a specific team discussion. You can optionally filter by reaction type. Note: OAuth app tokens and personal access tokens (classic) need the `read:discussion` scope to use this endpoint.","requiredInputs":["org","team_slug","discussion_number"],"family":"team"},{"slug":"GITHUB_LIST_REACTIONS_FOR_A_TEAM_DISCUSSION_COMMENT","toolkit":"github","name":"List reactions for a team discussion comment","description":"Lists reactions for a specific comment in a team discussion within an organization, optionally filtering by content type.","requiredInputs":["org","team_slug","comment_number","discussion_number"],"family":"team"},{"slug":"GITHUB_LIST_RELEASE_ASSETS","toolkit":"github","name":"List release assets","description":"Lists assets (e.g., compiled binaries, source code archives) for a specific GitHub release, identified by `release_id` which must be valid for an existing release in the repository.","requiredInputs":["repo","owner","release_id"],"family":"release"},{"slug":"GITHUB_LIST_REQUESTED_REVIEWERS_FOR_A_PULL_REQUEST","toolkit":"github","name":"Get all requested reviewers for a pull request","description":"Gets all users and teams requested to review a specific pull request in a repository.","requiredInputs":["repo","owner","pull_number"],"family":"pull"},{"slug":"GITHUB_LIST_REVIEWS_FOR_A_PULL_REQUEST","toolkit":"github","name":"List reviews for a pull request","description":"Lists submitted reviews chronologically for a specific pull request within a GitHub repository.","requiredInputs":["repo","owner","pull_number"],"family":"pull"},{"slug":"GITHUB_LIST_STATUS_CHECK_CONTEXTS","toolkit":"github","name":"Get all status check contexts","description":"Fetches all required status check contexts for a protected branch; returns an empty list if the branch isn't protected or has no required checks.","requiredInputs":["repo","owner","branch"],"family":"other"},{"slug":"GITHUB_LIST_SUB_ISSUES","toolkit":"github","name":"List sub-issues for an issue","description":"Tool to list sub-issues for a specific GitHub issue. Use when you need to retrieve all sub-issues associated with a parent issue, supporting pagination for large hierarchies.","requiredInputs":["repo","owner","issue_number"],"family":"issue"},{"slug":"GITHUB_LIST_TEAM_MEMBERS","toolkit":"github","name":"List team members","description":"Lists members of a specific team within an organization, including members of child teams.","requiredInputs":["org","team_slug"],"family":"team"},{"slug":"GITHUB_LIST_TEAM_REPOSITORIES","toolkit":"github","name":"List team repositories","description":"Lists repositories accessible to a specific team within a GitHub organization. Returns a list of repositories that the specified team has access to, including the team's permission level (admin, maintain, push, triage, pull) for each repository. Requires read:org scope and membership in the organization to access team data.","requiredInputs":["org","team_slug"],"family":"team"},{"slug":"GITHUB_LIST_TIMELINE_EVENTS_FOR_AN_ISSUE","toolkit":"github","name":"List timeline events for an issue","description":"Lists chronological events (e.g., comments, commits, label changes) for a specific issue in a GitHub repository.","requiredInputs":["repo","owner","issue_number"],"family":"issue"},{"slug":"GITHUB_LIST_WORKFLOW_RUNS_FOR_A_WORKFLOW","toolkit":"github","name":"List workflow runs for a workflow","description":"Lists runs for a specified, existing workflow (identified by ID or filename like `main.yml`) in a GitHub repository, with filtering options.","requiredInputs":["repo","owner","workflow_id"],"family":"workflow"},{"slug":"GITHUB_LOCK_AN_ISSUE","toolkit":"github","name":"Lock an issue","description":"Locks an existing GitHub issue's conversation, preventing further comments; an optional reason can be specified.","requiredInputs":["repo","owner","issue_number"],"family":"issue"},{"slug":"GITHUB_MARK_A_THREAD_AS_DONE","toolkit":"github","name":"Mark a thread as done","description":"Marks the GitHub notification thread (identified by `thread_id`) as done or read for the authenticated user, effectively archiving it.","requiredInputs":["thread_id"],"family":"thread"},{"slug":"GITHUB_MARK_A_THREAD_AS_READ","toolkit":"github","name":"Mark a thread as read","description":"Marks an existing GitHub notification thread, identified by its `thread_id`, as read.","requiredInputs":["thread_id"],"family":"thread"},{"slug":"GITHUB_MERGE_A_BRANCH","toolkit":"github","name":"Merge a branch","description":"Merges a head branch or commit SHA into a base branch in a repository; fails if there are merge conflicts requiring manual resolution.","requiredInputs":["base","head","repo","owner"],"family":"branch"},{"slug":"GITHUB_MERGE_A_PULL_REQUEST","toolkit":"github","name":"Merge a pull request","description":"Merges an open and mergeable pull request in a repository. A 405 error can occur for multiple reasons: (1) The PR is still in draft mode - convert it to ready-for-review first using GITHUB_UPDATE_A_PULL_REQUEST. (2) Branch protection rules are not satisfied - check for required approving reviews, status checks, or other repository rules that must be met before merging. (3) The base branch has been modified since the PR was last synced - update the PR branch first using GITHUB_UPDATE_A_PULL_REQUEST_BRANCH.","requiredInputs":["repo","owner","pull_number"],"family":"pull"},{"slug":"GITHUB_PING_AN_ORGANIZATION_WEBHOOK","toolkit":"github","name":"Ping an organization webhook","description":"Sends a 'ping' event to a specified, existing organization webhook to test its configuration and ensure it correctly receives events.","requiredInputs":["org","hook_id"],"family":"org"},{"slug":"GITHUB_PING_A_REPOSITORY_WEBHOOK","toolkit":"github","name":"Ping a repository webhook","description":"Pings an existing webhook on a repository to test its configuration and reachability by GitHub.","requiredInputs":["repo","owner","hook_id"],"family":"repo"},{"slug":"GITHUB_REDELIVER_A_DELIVERY_FOR_AN_ORGANIZATION_WEBHOOK","toolkit":"github","name":"Redeliver a delivery for an organization webhook","description":"Redelivers a specific webhook delivery for a webhook within an organization, to resend an event that previously failed or was not processed.","requiredInputs":["org","hook_id","delivery_id"],"family":"org"},{"slug":"GITHUB_REDELIVER_A_DELIVERY_FOR_A_REPOSITORY_WEBHOOK","toolkit":"github","name":"Redeliver a delivery for a repository webhook","description":"Redelivers a specific, previously made webhook delivery (`delivery_id`) for a repository's webhook (`hook_id`).","requiredInputs":["repo","owner","hook_id","delivery_id"],"family":"repo"},{"slug":"GITHUB_REMOVE_A_LABEL_FROM_AN_ISSUE","toolkit":"github","name":"Remove a label from an issue","description":"Removes a label currently applied to a specific issue in a repository.","requiredInputs":["name","repo","owner","issue_number"],"family":"label"},{"slug":"GITHUB_REMOVE_ALL_LABELS_FROM_AN_ISSUE","toolkit":"github","name":"Remove all labels from an issue","description":"Removes all labels from a specified issue in a GitHub repository; this operation is idempotent.","requiredInputs":["repo","owner","issue_number"],"family":"issue"},{"slug":"GITHUB_REMOVE_ALL_ORGANIZATION_ROLES_FOR_A_TEAM","toolkit":"github","name":"Remove all organization roles for a team","description":"Revokes all organization roles for a team in an organization; this is destructive and succeeds even if the team initially has no roles.","requiredInputs":["org","team_slug"],"family":"org"},{"slug":"GITHUB_REMOVE_AN_ORGANIZATION_ROLE_FROM_A_TEAM","toolkit":"github","name":"Remove an organization role from a team","description":"Revokes an organization role that a team currently possesses within an organization.","requiredInputs":["org","role_id","team_slug"],"family":"org"},{"slug":"GITHUB_REMOVE_APP_ACCESS_RESTRICTIONS","toolkit":"github","name":"Remove app access restrictions","description":"Removes all GitHub App access restrictions from a protected branch in a repository; the branch must have protection rules configured, and this action does not alter user or team restrictions.","requiredInputs":["repo","owner","branch"],"family":"other"},{"slug":"GITHUB_REMOVE_A_PROJECT_FROM_A_TEAM","toolkit":"github","name":"Remove a project from a team","description":"Removes a project from a team within an organization; this action requires the project to be currently associated with the team.","requiredInputs":["org","team_slug","project_id"],"family":"project"},{"slug":"GITHUB_REMOVE_A_REPOSITORY_FROM_AN_APP_INSTALLATION","toolkit":"github","name":"Remove a repository from an app installation","description":"Removes a repository from a GitHub App installation for the authenticated user, given a valid `installation_id` and the `repository_id` of a repository currently linked to that installation; this operation is idempotent.","requiredInputs":["repository_id","installation_id"],"family":"repo"},{"slug":"GITHUB_REMOVE_A_REPOSITORY_FROM_A_TEAM","toolkit":"github","name":"Remove a repository from a team","description":"Disassociates a repository from a team; team members may lose access permissions, but the repository and team are not deleted.","requiredInputs":["org","repo","owner","team_slug"],"family":"repo"},{"slug":"GITHUB_REMOVE_ASSIGNEES_FROM_AN_ISSUE","toolkit":"github","name":"Remove assignees from an issue","description":"Removes specified assignees from a GitHub issue; requires push access, and invalid removal attempts are silently ignored.","requiredInputs":["repo","owner","issue_number"],"family":"issue"},{"slug":"GITHUB_REMOVE_REQUESTED_REVIEWERS_FROM_A_PULL_REQUEST","toolkit":"github","name":"Remove requested reviewers from a pull request","description":"Removes currently assigned user logins and/or team slugs from a GitHub pull request's list of requested reviewers.","requiredInputs":["repo","owner","reviewers","pull_number"],"family":"pull"},{"slug":"GITHUB_REMOVE_REVIEW_REQUEST","toolkit":"github","name":"Remove review request","description":"Removes requested reviewers from a pull request. Use this action when you need to cancel a review request that was previously sent to users or teams. Only users with push access to the repository can remove review requests.","requiredInputs":["repo","owner","reviewers","pull_number"],"family":"review"},{"slug":"GITHUB_REMOVE_STATUS_CHECK_CONTEXTS","toolkit":"github","name":"Remove status check contexts","description":"Removes specified status check contexts from a protected branch's required status checks. This action removes the specified status check contexts from the existing list of required status checks for a protected branch. The branch must already have branch protection enabled with status checks configured. Note: The 'contexts' parameter is deprecated by GitHub in favor of 'checks' array. For new implementations, consider using update_status_check_protection with the 'checks' parameter instead.","requiredInputs":["repo","owner","branch","contexts"],"family":"other"},{"slug":"GITHUB_REMOVE_STATUS_CHECK_PROTECTION","toolkit":"github","name":"Remove status check protection","description":"Removes status check protection from a branch, disabling required status checks for merging pull requests; will only have an effect if status check protection is currently configured on the branch.","requiredInputs":["repo","owner","branch"],"family":"other"},{"slug":"GITHUB_REMOVE_TEAM_ACCESS_RESTRICTIONS","toolkit":"github","name":"Remove team access restrictions","description":"Removes specified teams from push access to a protected branch. This action removes teams from the list of teams with push access to a protected branch. Removing a team will also remove push access for any child teams. Prerequisites: - The repository must be owned by an organization (not a personal account) - The branch must have protection rules enabled - The branch protection must have restrictions configured - The teams must currently have push access to the branch","requiredInputs":["repo","owner","teams","branch"],"family":"team"},{"slug":"GITHUB_REMOVE_TEAM_MEMBERSHIP","toolkit":"github","name":"Remove team membership","description":"Tool to remove team membership for a user in an organization. Use when you need to revoke a user's membership from a specific team. This action is irreversible — the user must be explicitly re-added if you want to restore their team membership. Note that if team synchronization is set up, this operation may fail with a 403 Forbidden error.","requiredInputs":["org","username","team_slug"],"family":"team"},{"slug":"GITHUB_REMOVE_TEAM_MEMBERSHIP_FOR_A_USER","toolkit":"github","name":"Remove team membership for a user","description":"Removes a user from a specific team within an organization. This action requires admin:org scope permissions. It will fail if: - Team synchronization with an Identity Provider (IdP) is enabled (403 Forbidden) - The organization, team, or user membership doesn't exist (404 Not Found) - You don't have sufficient permissions to manage team memberships (403 Forbidden) Note: If the removed user was the last member and the team is not nested, the team may be deleted automatically.","requiredInputs":["org","username","team_slug"],"family":"team"},{"slug":"GITHUB_REMOVE_USER_ACCESS_RESTRICTIONS","toolkit":"github","name":"Remove user access restrictions","description":"Removes specified users from the list of people allowed to push to a protected branch. Important notes: - This action only works on organization-owned repositories (not personal repos) - The branch must have protection rules with push restrictions enabled - Users being removed must currently have push access to the branch - The combined total of users, apps, and teams is limited to 100 items","requiredInputs":["repo","owner","users","branch"],"family":"user"},{"slug":"GITHUB_REMOVE_USER_AS_A_COLLABORATOR","toolkit":"github","name":"Remove user as a collaborator (classic project)","description":"Removes a user as a collaborator from an organization project (classic). IMPORTANT: This action uses the Projects (classic) REST API which is being deprecated. The Projects (classic) feature was sunset on GitHub.com. This API may still work on GitHub Enterprise Server versions before 3.17. Requirements: - You must be an organization owner or a project admin to remove a collaborator - The user must already be a collaborator on the specified project - The project must be an organization project (classic), not a Projects V2 project For GitHub.com users: Consider using GitHub Projects V2 instead, which can be managed through the GraphQL API.","requiredInputs":["username","project_id"],"family":"user"},{"slug":"GITHUB_RENAME_A_BRANCH","toolkit":"github","name":"Rename a branch","description":"Renames an existing branch in a GitHub repository; the new name must be unique and adhere to GitHub's naming conventions, and the current branch name cannot contain wildcard characters.","requiredInputs":["repo","owner","branch","new_name"],"family":"branch"},{"slug":"GITHUB_REOPEN_ISSUE","toolkit":"github","name":"Reopen an issue","description":"Reopens a closed GitHub issue by changing its state to 'open' with state_reason 'reopened'. Use this action when you need to reopen a previously closed issue that requires further attention or work. Only users with push access to the repository can reopen issues.","requiredInputs":["repo","owner","issue_number"],"family":"issue"},{"slug":"GITHUB_REOPEN_PULL_REQUEST","toolkit":"github","name":"Reopen Pull Request","description":"Reopens a previously closed pull request by setting its state to 'open'. This restores the pull request to an active state where it can be reviewed, commented on, and merged. Use this action when you need to reactivate a closed pull request that was closed prematurely or needs to be reconsidered for merging.","requiredInputs":["repo","owner","pull_number"],"family":"pull"},{"slug":"GITHUB_REQUEST_REVIEWERS","toolkit":"github","name":"Request reviewers for a pull request","description":"Requests reviewers for a specific pull request identified by owner, repository, and pull request number. Use this action when you need to add individual users or teams as reviewers to an existing pull request. At least one of reviewers (individual users) or team_reviewers (teams) must be provided.","requiredInputs":["repo","owner","pull_number"],"family":"pull"},{"slug":"GITHUB_REQUEST_REVIEWERS_FOR_A_PULL_REQUEST","toolkit":"github","name":"Add reviewers to a specific pull request","description":"Adds reviewers to a specific pull request identified by owner, repo, and pull_number. This is NOT a search action - it operates on an already-known PR number. Requires `owner`, `repo`, `pull_number`, and at least one of `reviewers` or `team_reviewers`.","requiredInputs":["repo","owner","pull_number"],"family":"pull"},{"slug":"GITHUB_REREQUEST_A_CHECK_RUN","toolkit":"github","name":"Rerequest a check run","description":"Triggers a re-run of a specific check run in a GitHub repository, resetting its status to 'queued', clearing its conclusion, and triggering the `check_run` webhook with `rerequested` action. IMPORTANT: This endpoint requires GitHub App authentication with 'checks:write' permission. The check run can ONLY be re-requested by the same GitHub App that originally created it. OAuth tokens and personal access tokens (PAT) cannot use this endpoint.","requiredInputs":["repo","owner","check_run_id"],"family":"check_run"},{"slug":"GITHUB_REREQUEST_A_CHECK_SUITE","toolkit":"github","name":"Rerequest a check suite","description":"Triggers a new run of an existing check suite within a repository, resetting its status to 'queued', clearing its conclusion, and triggering the `check_suite` webhook with `rerequested` action. IMPORTANT: This endpoint requires GitHub App authentication with 'checks:write' permission. OAuth tokens and classic personal access tokens (PAT) cannot use this endpoint. Only GitHub App user access tokens, GitHub App installation access tokens, or fine-grained personal access tokens with checks:write permission are supported.","requiredInputs":["repo","owner","check_suite_id"],"family":"check_run"},{"slug":"GITHUB_SET_ADMIN_BRANCH_PROTECTION","toolkit":"github","name":"Set admin branch protection","description":"Enables administrator enforcement on a branch, making existing protection rules also apply to administrators; branch protection rules must already be configured.","requiredInputs":["repo","owner","branch"],"family":"branch"},{"slug":"GITHUB_SET_APP_ACCESS_RESTRICTIONS","toolkit":"github","name":"Set app access restrictions","description":"Replaces the list of GitHub Apps permitted to push to a protected branch. This action completely replaces the existing list of apps with push access - it does not add to or merge with the current list. Requirements: - The branch must already have protection rules enabled with push restrictions configured - Apps must be installed on the repository and have 'contents' write permission - Push restrictions are only available for organization-owned repositories with GitHub Team or Enterprise Cloud plans","requiredInputs":["apps","repo","owner","branch"],"family":"other"},{"slug":"GITHUB_SET_A_THREAD_SUBSCRIPTION","toolkit":"github","name":"Set a thread subscription","description":"Sets whether a GitHub notification thread is ignored (muted) or unignored (unmuted), for a `thread_id` that must identify an existing notification thread.","requiredInputs":["thread_id"],"family":"thread"},{"slug":"GITHUB_SET_LABELS_FOR_AN_ISSUE","toolkit":"github","name":"Set labels for an issue","description":"Replaces all existing labels on a GitHub issue with a new set of labels.","requiredInputs":["repo","owner","labels","issue_number"],"family":"issue"},{"slug":"GITHUB_SET_STATUS_CHECK_CONTEXTS","toolkit":"github","name":"Set status check contexts","description":"Replaces required status check contexts for a protected branch, requiring admin permissions; an empty `contexts` array removes all checks.","requiredInputs":["repo","owner","branch","contexts"],"family":"other"},{"slug":"GITHUB_SET_TEAM_ACCESS_RESTRICTIONS","toolkit":"github","name":"Set team access restrictions","description":"Replaces the list of teams with push access to a protected branch. This action sets (replaces) the teams that have push access to a protected branch. Unlike 'Add team access restrictions' (POST), this action replaces the entire list rather than adding to it. Use an empty list to remove all team restrictions. Prerequisites: - The repository must be owned by an organization (not a personal account) - The branch must have protection rules enabled - The branch protection must have restrictions configured - The teams must exist in the organization and have repository access","requiredInputs":["repo","owner","teams","branch"],"family":"team"},{"slug":"GITHUB_SET_USER_ACCESS_RESTRICTIONS","toolkit":"github","name":"Set user access restrictions","description":"Replaces the list of users with push access to a protected branch in an organization repository. Important notes: - This action only works on organization-owned repositories (not personal repos) - The branch must already have protection rules with restrictions enabled - This REPLACES (not adds to) the existing list of users with push access - Users must have write access to the repository to be added - The combined total of users, apps, and teams is limited to 100 items - To add users without replacing, use the 'add_user_access_restrictions' action instead","requiredInputs":["repo","owner","users","branch"],"family":"user"},{"slug":"GITHUB_STAR_A_GIST","toolkit":"github","name":"Star a gist","description":"Stars a GitHub gist identified by `gist_id`; this action is idempotent and returns a 204 No Content status upon success, even if the gist is already starred.","requiredInputs":["gist_id"],"family":"gist"},{"slug":"GITHUB_SUBMIT_A_REVIEW_FOR_A_PULL_REQUEST","toolkit":"github","name":"Submit a review for a pull request","description":"Finalizes a pending pull request review (identified by `review_id`) with a required `event` (APPROVE, REQUEST_CHANGES, COMMENT) and an optional `body`.","requiredInputs":["repo","event","owner","review_id","pull_number"],"family":"review"},{"slug":"GITHUB_SYNC_FORK_BRANCH_WITH_UPSTREAM","toolkit":"github","name":"Sync a fork branch with the upstream repository","description":"Synchronizes a branch in a forked GitHub repository with its upstream counterpart, assuming the repository is a fork, the branch exists, an upstream is configured, and the merge is conflict-free.","requiredInputs":["repo","owner","branch"],"family":"branch"},{"slug":"GITHUB_TEST_REPOSITORY_WEBHOOK","toolkit":"github","name":"Test the push repository webhook","description":"Triggers a simulated push event to test a repository's push webhook; a test event is only delivered if the webhook is subscribed to 'push' events, otherwise, it returns 204 No Content without sending a POST.","requiredInputs":["repo","owner","hook_id"],"family":"repo"},{"slug":"GITHUB_UNLOCK_AN_ISSUE","toolkit":"github","name":"Unlock an issue","description":"Unlocks a currently locked GitHub issue in the specified repository, allowing new comments and interactions.","requiredInputs":["repo","owner","issue_number"],"family":"issue"},{"slug":"GITHUB_UNSTAR_A_GIST","toolkit":"github","name":"Unstar a gist","description":"Removes a star from the specified gist; the action is idempotent and will not error if the gist was not previously starred by the user.","requiredInputs":["gist_id"],"family":"gist"},{"slug":"GITHUB_UPDATE_A_CHECK_RUN","toolkit":"github","name":"Update a check run","description":"Updates an existing check run for a specific commit in a repository, allowing modifications to its status, conclusion, output, and other details. NOTE: This endpoint requires GitHub App authentication with 'checks:write' permission - OAuth tokens and personal access tokens cannot update check runs.","requiredInputs":["repo","owner","check_run_id"],"family":"check_run"},{"slug":"GITHUB_UPDATE_A_COMMIT_COMMENT","toolkit":"github","name":"Update a commit comment","description":"Changes the body of an existing commit comment.","requiredInputs":["body","repo","owner","comment_id"],"family":"commit"},{"slug":"GITHUB_UPDATE_A_DISCUSSION","toolkit":"github","name":"Update a discussion","description":"Updates the title and/or body of a specific team discussion within an organization.","requiredInputs":["org","team_slug","discussion_number"],"family":"discussion"},{"slug":"GITHUB_UPDATE_A_DISCUSSION_COMMENT","toolkit":"github","name":"Update a discussion comment","description":"Updates the body of a comment in a team's discussion within an organization.","requiredInputs":["org","body","team_slug","comment_number","discussion_number"],"family":"discussion"},{"slug":"GITHUB_UPDATE_A_GIST","toolkit":"github","name":"Update a gist","description":"Updates a gist's description, and/or its files (including content, filename changes, or deletion).","requiredInputs":["gist_id"],"family":"gist"},{"slug":"GITHUB_UPDATE_A_GIST_COMMENT","toolkit":"github","name":"Update a gist comment","description":"Updates an existing comment on a specified gist.","requiredInputs":["body","gist_id","comment_id"],"family":"gist"},{"slug":"GITHUB_UPDATE_A_MILESTONE","toolkit":"github","name":"Update a milestone","description":"Updates a milestone in a repository, identified by `owner`, `repo`, and `milestone_number`, by allowing modification of its `title`, `state`, `description`, or `due_on`; at least one of these four attributes must be provided to perform an update.","requiredInputs":["repo","owner","milestone_number"],"family":"milestone"},{"slug":"GITHUB_UPDATE_AN_ISSUE","toolkit":"github","name":"Update an issue","description":"Updates an existing GitHub issue's title, body, state, milestone, labels, or assignees; `state_reason` is only processed if `state` also changes, and use `null` or `[]` to clear applicable fields.","requiredInputs":["repo","owner","issue_number"],"family":"issue"},{"slug":"GITHUB_UPDATE_AN_ISSUE_COMMENT","toolkit":"github","name":"Update an issue comment","description":"Updates an existing comment on an issue or pull request within a specified repository. You can only update comments that the authenticated user has permission to edit. The comment_id can be obtained from the list_issue_comments or get_an_issue_comment actions.","requiredInputs":["body","repo","owner","comment_id"],"family":"issue"},{"slug":"GITHUB_UPDATE_AN_ORGANIZATION_WEBHOOK","toolkit":"github","name":"Update an organization webhook","description":"Updates the configuration (URL, content type, secret, SSL verification), subscribed events, active status, or name of an existing webhook for a specified organization.","requiredInputs":["org","hook_id"],"family":"org"},{"slug":"GITHUB_UPDATE_A_PROJECT","toolkit":"github","name":"Update a project","description":"Updates an existing GitHub project (V2) attributes like title, description, visibility, and state. Note: This action uses GitHub's Projects V2 GraphQL API. The legacy Projects (classic) REST API was sunset on April 1, 2025. The project is identified by its number (visible in the project URL) and owner (either a username or organization name). If no owner is specified, the authenticated user is assumed. At least one field to update must be provided.","requiredInputs":["project_number"],"family":"project"},{"slug":"GITHUB_UPDATE_A_PULL_REQUEST","toolkit":"github","name":"Update a pull request","description":"Updates an existing pull request, allowing changes to attributes like title, body, state, base branch, and maintainer modification settings.","requiredInputs":["repo","owner","pull_number"],"family":"pull"},{"slug":"GITHUB_UPDATE_A_PULL_REQUEST_BRANCH","toolkit":"github","name":"Update a pull request branch","description":"Updates an open pull request's head branch by merging the latest changes from its base branch, if mergeable and repository merging is enabled; operates asynchronously.","requiredInputs":["repo","owner","pull_number"],"family":"pull"},{"slug":"GITHUB_UPDATE_A_REFERENCE","toolkit":"github","name":"Update a reference","description":"Updates an existing Git reference (e.g., a branch or tag) to point to a specific commit SHA. By default, only allows fast-forward updates (where the new commit is a descendant of the current one). Set `force=true` to allow non-fast-forward updates that rewrite history. IMPORTANT: The reference must already exist - use 'Create a reference' action to create new refs.","requiredInputs":["ref","sha","repo","owner"],"family":"other"},{"slug":"GITHUB_UPDATE_A_RELEASE","toolkit":"github","name":"Update a release","description":"Updates an existing release in a GitHub repository, allowing modification of its attributes; if linking a discussion, the `discussion_category_name` must refer to an existing category in the repository.","requiredInputs":["repo","owner","release_id"],"family":"release"},{"slug":"GITHUB_UPDATE_A_RELEASE_ASSET","toolkit":"github","name":"Update a release asset","description":"Updates the name, label, or state of a release asset in a GitHub repository, requiring at least one of these properties to be provided for modification.","requiredInputs":["repo","owner","asset_id"],"family":"release"},{"slug":"GITHUB_UPDATE_A_REPOSITORY_INVITATION","toolkit":"github","name":"Update a repository invitation","description":"Updates an active repository invitation to modify the invited user's permissions; the specified repository and invitation must exist.","requiredInputs":["repo","owner","invitation_id"],"family":"repo"},{"slug":"GITHUB_UPDATE_A_REPOSITORY_WEBHOOK","toolkit":"github","name":"Update a repository webhook","description":"Updates the URL, content type, secret, SSL verification, events, or active status for an existing repository webhook, specified by `owner`, `repo`, and `hook_id`.","requiredInputs":["repo","owner","hook_id"],"family":"repo"},{"slug":"GITHUB_UPDATE_A_TEAM","toolkit":"github","name":"Update a team","description":"Updates a team's settings (e.g., name, description, privacy, parent team) within a GitHub organization, identified by its slug and organization name.","requiredInputs":["org","team_slug"],"family":"team"},{"slug":"GITHUB_UPDATE_BRANCH_PROTECTION","toolkit":"github","name":"Update branch protection","description":"Updates the protection settings for an existing branch in a repository, which must not contain wildcard characters.","requiredInputs":["repo","owner","branch"],"family":"branch"},{"slug":"GITHUB_UPDATE_ORGANIZATION_WEBHOOK_CONFIGURATION","toolkit":"github","name":"Update a webhook configuration for an organization","description":"Updates the configuration (URL, content type, secret, SSL verification) for an existing webhook within a specified organization.","requiredInputs":["org","hook_id"],"family":"org"},{"slug":"GITHUB_UPDATE_PULL_REQUEST_REVIEW","toolkit":"github","name":"Update a review for a pull request","description":"Updates the body text of an existing pull request review.","requiredInputs":["body","repo","owner","review_id","pull_number"],"family":"pull"},{"slug":"GITHUB_UPDATE_PULL_REQUEST_REVIEW_COMMENT","toolkit":"github","name":"Update a review comment for a pull request","description":"Updates the body of an existing review comment on a pull request.","requiredInputs":["body","repo","owner","comment_id"],"family":"pull"},{"slug":"GITHUB_UPDATE_PULL_REQUEST_REVIEW_PROTECTION","toolkit":"github","name":"Update pull request review protection","description":"Updates pull request review protection settings (e.g., required approvals, review dismissal, bypass allowances) for a branch; branch protection features must be available for the repository.","requiredInputs":["repo","owner","branch"],"family":"pull"},{"slug":"GITHUB_UPDATE_REPOSITORY_WEBHOOK_CONFIGURATION","toolkit":"github","name":"Update a webhook configuration for a repository","description":"Updates the configuration (e.g., payload URL, content type, secret, SSL verification) for an existing webhook in a specified repository.","requiredInputs":["repo","owner","hook_id"],"family":"repo"},{"slug":"GITHUB_UPDATE_STATUS_CHECK_PROTECTION","toolkit":"github","name":"Update status check protection","description":"Updates required status checks for a branch, optionally requiring it to be up-to-date before merging.","requiredInputs":["repo","owner","branch"],"family":"other"},{"slug":"GITHUB_UPDATE_USER_PROJECT_ITEM","toolkit":"github","name":"Update Project V2 Item for User","description":"Tool to update a field value for an item in a user's GitHub ProjectV2. Use when you need to modify a field value of an existing project item.","requiredInputs":["value","itemId","fieldId","projectId"],"family":"user"},{"slug":"GITHUB_UPLOAD_RELEASE_ASSET","toolkit":"github","name":"Upload a release asset","description":"Tool to upload a binary asset to an existing GitHub release. Use when you need to attach files like installers or backups to a release programmatically.","requiredInputs":["repo","asset","owner","release_id","content_type"],"family":"release"},{"slug":"GITHUB_UPLOAD_SARIF_ANALYSIS","toolkit":"github","name":"Upload an analysis as sarif data","description":"Uploads a gzipped and Base64 encoded SARIF file to a GitHub repository for a specific commit and reference; use `checkout_uri` if SARIF paths are absolute.","requiredInputs":["ref","repo","owner","sarif","commit_sha"],"family":"other"},{"slug":"GOOGLESUPER_SEARCH_PEOPLE","toolkit":"googlesuper","name":"Search People","description":"Searches contacts by matching the query against names, nicknames, emails, phone numbers, and organizations, optionally including 'Other Contacts'. Only searches the authenticated user's contact directory — people existing solely in message headers won't appear; use GMAIL_FETCH_EMAILS for those. Results may be zero or multiple; never auto-select from ambiguous results. Results paginate via next_page_token; follow until empty and deduplicate by email. Many records lack emailAddresses or names even when requested — handle missing keys. Directory/organization policies may suppress entries.","requiredInputs":["query"],"family":"contact"},{"slug":"GOOGLESUPER_GET_PEOPLE","toolkit":"googlesuper","name":"Get People","description":"Retrieves either a specific person's details (using `resource_name`) or lists 'Other Contacts' (if `other_contacts` is true), with `person_fields` specifying the data to return. Scope is limited to the authenticated user's own contacts and 'Other Contacts' history only.","requiredInputs":[],"family":"contact"},{"slug":"GOOGLESUPER_GET_PERMISSION_ID_FOR_EMAIL","toolkit":"googlesuper","name":"Get Permission ID for Email","description":"Tool to get the permission ID for an email address using the Drive API v2. Use when you need to convert an email address to its corresponding permission ID.","requiredInputs":["email"],"family":"permission"},{"slug":"GOOGLESUPER_LIST_SMIME_INFO","toolkit":"googlesuper","name":"List S/MIME configs","description":"Lists S/MIME configs for the specified send-as alias. Use when you need to retrieve all S/MIME certificate configurations associated with a specific send-as email address.","requiredInputs":["send_as_email"],"family":"other"},{"slug":"GOOGLESUPER_PATCH_SEND_AS","toolkit":"googlesuper","name":"Patch send-as alias","description":"Tool to patch the specified send-as alias for a Gmail user. Use when you need to update properties of an existing send-as email address such as display name, reply-to address, signature, default status, or SMTP configuration.","requiredInputs":["send_as_email"],"family":"alias"},{"slug":"GOOGLESUPER_SEND_EMAIL","toolkit":"googlesuper","name":"Send Email","description":"Sends an email via Gmail API using the authenticated user's Google profile display name. Sends immediately and is irreversible — confirm recipients, subject, body, and attachments before calling. At least one of 'to' (or 'recipient_email'), 'cc', or 'bcc' must be provided. At least one of subject or body must be provided. Requires `is_html=True` if the body contains HTML. All common file types including PNG, JPG, PDF, MP4, etc. are supported as attachments. Gmail API limits total message size to ~25 MB after base64 encoding. To reply in an existing thread, use GMAIL_REPLY_TO_THREAD instead. No scheduled send support; enforce timing externally.","requiredInputs":[],"family":"other"},{"slug":"GOOGLESUPER_SETTINGS_SEND_AS_GET","toolkit":"googlesuper","name":"Get send-as alias","description":"Tool to retrieve a specific send-as alias configuration for a Gmail user. Use when you need to get details about a send-as email address including display name, signature, SMTP settings, and verification status. Fails with HTTP 404 if the specified address is not a member of the send-as collection.","requiredInputs":["send_as_email"],"family":"alias"},{"slug":"GOOGLESUPER_UPDATE_SEND_AS","toolkit":"googlesuper","name":"Update send-as alias","description":"Tool to update a send-as alias for a Gmail user. Use when you need to modify display name, signature, reply-to address, or SMTP settings for a send-as email address. Gmail sanitizes HTML signatures before saving. Addresses other than the primary can only be updated by service accounts with domain-wide authority.","requiredInputs":["send_as_email"],"family":"alias"},{"slug":"GITHUB_SEARCH_USERS","toolkit":"github","name":"Search users","description":"Searches for users on GitHub by criteria like username, email, location, followers, or repository associations, using a flexible query string `q`.","requiredInputs":["q"],"family":"other"},{"slug":"GITHUB_ADD_A_REPOSITORY_COLLABORATOR","toolkit":"github","name":"Add a repository collaborator","description":"Adds a GitHub user as a repository collaborator, or updates their permission if already a collaborator; `permission` applies to organization-owned repositories (personal ones default to 'push' and ignore this field), and an invitation may be created or permissions updated directly.","requiredInputs":["repo","owner","username"],"family":"repo"},{"slug":"GITHUB_ADD_RUNNER_LABELS","toolkit":"github","name":"Add runner labels","description":"Adds and appends custom labels to a self-hosted repository runner, which must be registered and active.","requiredInputs":["repo","owner","labels","runner_id"],"family":"other"},{"slug":"GITHUB_APPROVE_WORKFLOW_RUN_FOR_FORK_PULL_REQUEST","toolkit":"github","name":"Approve a workflow run for a fork pull request","description":"Approves a workflow run from a forked repository's pull request; call this when such a run requires manual approval due to workflow configuration.","requiredInputs":["repo","owner","run_id"],"family":"workflow"},{"slug":"GITHUB_ASSIGN_ORGANIZATION_ROLE_TO_USER","toolkit":"github","name":"Assign an organization role to a user","description":"Assigns a specific organization role to a user who is a member or an outside collaborator in a GitHub organization, using a valid role ID.","requiredInputs":["org","role_id","username"],"family":"org"},{"slug":"GITHUB_BLOCK_USER","toolkit":"github","name":"Block a user","description":"Blocks an existing individual GitHub user (not an organization or your own account), preventing them from interacting with your account and repositories.","requiredInputs":["username"],"family":"user"},{"slug":"GITHUB_BLOCK_USER_FROM_ORGANIZATION","toolkit":"github","name":"Block a user from an organization","description":"Blocks a GitHub user from an organization, preventing their contributions, collaboration, and forking of the organization's repositories. Requires admin or 'Blocking users' organization permission (write access).","requiredInputs":["org","username"],"family":"user"},{"slug":"GITHUB_CANCEL_GITHUB_PAGES_DEPLOYMENT","toolkit":"github","name":"Cancel a GitHub Pages deployment","description":"Cancels an existing, ongoing or queued GitHub Pages deployment for a repository using its `pages_deployment_id`.","requiredInputs":["repo","owner","pages_deployment_id"],"family":"deployment"},{"slug":"GITHUB_CANCEL_WORKFLOW_RUN","toolkit":"github","name":"Cancel a workflow run","description":"Cancels a workflow run in a GitHub repository if it is in a cancellable state (e.g., 'in_progress' or 'queued'). Returns 202 Accepted on success.","requiredInputs":["repo","owner","run_id"],"family":"workflow"},{"slug":"GITHUB_CHECK_FOLLOWING","toolkit":"github","name":"Check if following user","description":"Check if the authenticated user is following a specified person on GitHub. Use this action when you need to verify whether the currently authenticated user follows another GitHub user. The action returns a boolean status and descriptive message.","requiredInputs":["username"],"family":"user"},{"slug":"GITHUB_CHECK_IF_REPO_STARRED_BY_AUTH_USER","toolkit":"github","name":"Check if repo starred by auth user","description":"DEPRECATED: Use `GITHUB_CHECK_IF_A_REPOSITORY_IS_STARRED_BY_THE_USER` instead.","requiredInputs":["repo","owner"],"family":"repo"},{"slug":"GITHUB_CHECK_IF_USER_CAN_BE_ASSIGNED","toolkit":"github","name":"Check if a user can be assigned","description":"Verifies if a GitHub user can be assigned to issues in a repository; assignability is confirmed by an HTTP 204 (No Content) response, resulting in an empty 'data' field in the response.","requiredInputs":["repo","owner","assignee"],"family":"user"},{"slug":"GITHUB_CHECK_IF_USER_FOLLOWS_ANOTHER_USER","toolkit":"github","name":"Check if a user follows another user","description":"Checks if a GitHub user `username` follows `target_user`; returns a 204 HTTP status if true, 404 if not or if users are invalid.","requiredInputs":["username","target_user"],"family":"user"},{"slug":"GITHUB_CHECK_IF_USER_IS_BLOCKED_BY_AUTHENTICATED_USER","toolkit":"github","name":"Check if a user is blocked by the authenticated user","description":"Checks if the specified GitHub user is blocked by the authenticated user; a 204 No Content response indicates the user is blocked, while a 404 Not Found indicates they are not.","requiredInputs":["username"],"family":"user"},{"slug":"GITHUB_CHECK_IF_USER_IS_BLOCKED_BY_ORGANIZATION","toolkit":"github","name":"Check if a user is blocked by an organization","description":"Checks if a GitHub user is blocked by an organization. Returns is_blocked=True if the user is blocked (HTTP 204), or is_blocked=False if not blocked (HTTP 404). Requires 'Blocking users' organization permission (read access).","requiredInputs":["org","username"],"family":"user"},{"slug":"GITHUB_CHECK_IF_USER_IS_REPOSITORY_COLLABORATOR","toolkit":"github","name":"Check if a user is a repository collaborator","description":"Checks if a user is a collaborator on a specified GitHub repository, returning a 204 status if they are, or a 404 status if they are not or if the repository/user does not exist.","requiredInputs":["repo","owner","username"],"family":"user"},{"slug":"GITHUB_CHECK_PERSON_FOLLOWED_BY_AUTH_USER","toolkit":"github","name":"Check if person is followed by authenticated user","description":"Checks if the authenticated GitHub user follows a target GitHub user. Returns a structured response with is_following=True when following (HTTP 204), or is_following=False when not following (HTTP 404).","requiredInputs":["username"],"family":"contact"},{"slug":"GITHUB_CHECK_PRIVATE_VULNERABILITY_REPORTING_STATUS","toolkit":"github","name":"Check private vulnerability reporting status","description":"Checks if private vulnerability reporting is enabled for the specified repository.","requiredInputs":["repo","owner"],"family":"other"},{"slug":"GITHUB_CHECK_PUBLIC_ORGANIZATION_MEMBERSHIP_FOR_USER","toolkit":"github","name":"Check public organization membership","description":"Tool to check if a user is a public member of an organization. Use when you need to verify public organization membership status.","requiredInputs":["org","username"],"family":"org"},{"slug":"GITHUB_CHECK_REPOSITORY_STARRED","toolkit":"github","name":"Check if repository is starred","description":"Check if a repository is starred by the authenticated user. Use this action when you need to verify whether the authenticated user has starred a specific repository. This is useful for confirming star status before performing star/unstar operations or displaying repository status.","requiredInputs":["repo","owner"],"family":"repo"},{"slug":"GITHUB_CLEAR_REPOSITORY_CACHE_BY_KEY","toolkit":"github","name":"Clear repository cache by key","description":"Deletes GitHub Actions caches from a repository matching a specific `key` and an optional Git `ref`, used to manage storage or clear outdated/corrupted caches; the action succeeds even if no matching caches are found to delete.","requiredInputs":["key","repo","owner"],"family":"repo"},{"slug":"GITHUB_CONVERT_ORG_MEMBER_TO_OUTSIDE_COLLABORATOR","toolkit":"github","name":"Convert an organization member to outside collaborator","description":"Converts an existing organization member, who is not an owner, to an outside collaborator, restricting their access to explicitly granted repositories.","requiredInputs":["org","username"],"family":"org"},{"slug":"GITHUB_CREATE_A_BLOB","toolkit":"github","name":"Create a blob","description":"Creates a Git blob in a repository, requiring content and encoding ('utf-8' or 'base64'). Requires write access to the repository.","requiredInputs":["repo","owner","content"],"family":"other"},{"slug":"GITHUB_CREATE_A_CHECK_SUITE","toolkit":"github","name":"Create a check suite","description":"Creates a new check suite for a specific commit (`head_sha`) in an original repository (not a fork). IMPORTANT: This endpoint requires a GitHub App installation access token - OAuth tokens and classic personal access tokens cannot use this endpoint. GitHub dispatches a `check_suite` webhook event with the `requested` action upon success.","requiredInputs":["repo","owner","head_sha"],"family":"check_run"},{"slug":"GITHUB_CREATE_A_CODESPACE_IN_A_REPOSITORY","toolkit":"github","name":"Create a codespace in a repository","description":"Creates a GitHub Codespace for the authenticated user in a specified repository, which must be accessible and use a valid `devcontainer.json` if `devcontainer_path` is specified.","requiredInputs":["repo","owner"],"family":"repo"},{"slug":"GITHUB_CREATE_A_COMMIT","toolkit":"github","name":"Create a commit","description":"Creates a new commit in a GitHub repository; the `tree` SHA and any `parents` SHAs must already exist in the repository.","requiredInputs":["repo","tree","owner","message"],"family":"commit"},{"slug":"GITHUB_CREATE_A_DEPLOY_KEY","toolkit":"github","name":"Create a deploy key","description":"Creates a deploy key for a repository; the repository must exist and be accessible, and the provided key must be a valid public SSH key.","requiredInputs":["key","repo","owner"],"family":"other"},{"slug":"GITHUB_CREATE_A_DEPLOYMENT","toolkit":"github","name":"Create a deployment","description":"Creates a GitHub deployment for an existing repository, targeting a specific ref (branch, tag, or SHA) that must also exist within the repository.","requiredInputs":["ref","repo","owner"],"family":"deployment"},{"slug":"GITHUB_CREATE_A_DEPLOYMENT_BRANCH_POLICY","toolkit":"github","name":"Create a deployment branch policy","description":"Creates a deployment branch or tag policy for an existing environment in a GitHub repository, using a Ruby File.fnmatch pattern (where `*` doesn't match `/`) to specify which branches or tags are deployable.","requiredInputs":["name","repo","owner","environment_name"],"family":"deployment"},{"slug":"GITHUB_CREATE_A_FORK","toolkit":"github","name":"Create a fork","description":"Creates a fork of an accessible repository, optionally into a specific organization, with a new name, or copying only the default branch.","requiredInputs":["repo","owner"],"family":"other"},{"slug":"GITHUB_CREATE_A_GITHUB_PAGES_DEPLOYMENT","toolkit":"github","name":"Create a github pages deployment","description":"Creates a GitHub Pages deployment for a repository using a specified artifact and OIDC token, provided GitHub Pages is enabled and the artifact (containing static assets) is accessible.","requiredInputs":["repo","owner","oidc_token"],"family":"deployment"},{"slug":"GITHUB_CREATE_A_GITHUB_PAGES_SITE","toolkit":"github","name":"Create a github pages site","description":"Configures or updates GitHub Pages for a repository, setting build type and source; ensure a Pages workflow exists for 'workflow' `build_type`, or `source_branch` exists for 'legacy' or unspecified `build_type`. This action allows users to effectively manage their GitHub Pages site settings, specifying how the site is built and where the source files are located.","requiredInputs":["repo","owner"],"family":"site"},{"slug":"GITHUB_CREATE_A_LABEL","toolkit":"github","name":"Create a label","description":"Creates a new label in a specified GitHub repository, provided the repository exists and the user has write permissions.","requiredInputs":["name","repo","color","owner"],"family":"label"},{"slug":"GITHUB_CREATE_A_MILESTONE","toolkit":"github","name":"Create a milestone","description":"Creates a milestone in a GitHub repository for tracking progress on issues or pull requests; requires repository existence and user write permissions.","requiredInputs":["repo","owner","title"],"family":"milestone"},{"slug":"GITHUB_CREATE_AN_AUTOLINK_REFERENCE_FOR_A_REPOSITORY","toolkit":"github","name":"Create an autolink reference for a repository","description":"Creates a repository autolink to automatically convert text references (e.g., 'TICKET-123') into hyperlinks, using a unique `key_prefix` and a `url_template` that includes `<num>`.","requiredInputs":["repo","owner","key_prefix","url_template"],"family":"repo"},{"slug":"GITHUB_CREATE_AN_ENVIRONMENT_VARIABLE","toolkit":"github","name":"Create an environment variable","description":"Creates an encrypted environment variable for a pre-existing environment within a GitHub repository; will fail if the variable name already exists.","requiredInputs":["name","repo","owner","value","environment_name"],"family":"environment"},{"slug":"GITHUB_CREATE_AN_ISSUE","toolkit":"github","name":"Create an issue","description":"Creates a new issue in a GitHub repository, requiring the repository to exist and have issues enabled; specific fields like assignees, milestone, or labels may require push access.","requiredInputs":["repo","owner","title"],"family":"issue"},{"slug":"GITHUB_CREATE_A_REGISTRATION_TOKEN_FOR_A_REPOSITORY","toolkit":"github","name":"Create a registration token for a repository","description":"Generates a time-limited token required to register a new self-hosted runner with a specific repository.","requiredInputs":["repo","owner"],"family":"repo"},{"slug":"GITHUB_CREATE_A_REMOVE_TOKEN_FOR_A_REPOSITORY","toolkit":"github","name":"Create a remove token for a repository","description":"Generates a temporary (one-hour validity) token required to unregister and remove a self-hosted runner from a repository.","requiredInputs":["repo","owner"],"family":"repo"},{"slug":"GITHUB_CREATE_A_REPOSITORY_DISPATCH_EVENT","toolkit":"github","name":"Create a repository dispatch event","description":"Triggers a GitHub Actions workflow or a webhook on a repository by creating a repository dispatch event, allowing programmatic triggering of workflows based on events outside of GitHub.","requiredInputs":["repo","owner","event_type"],"family":"repo"},{"slug":"GITHUB_CREATE_A_REPOSITORY_PROJECT","toolkit":"github","name":"Create a repository project","description":"Creates a new GitHub Projects V2 project board linked to a specified repository. Note: This action uses GitHub's Projects V2 GraphQL API. The legacy Projects V1 REST API has been sunset by GitHub. The project is owned by the repository owner (user or organization) and linked to the specified repository.","requiredInputs":["name","repo","owner"],"family":"repo"},{"slug":"GITHUB_CREATE_A_REPOSITORY_RULESET","toolkit":"github","name":"Create a repository ruleset","description":"Creates a uniquely named ruleset for a repository, defining rules for branches or tags with specified enforcement, conditions, and bypass actors.","requiredInputs":["name","repo","owner","enforcement"],"family":"repo"},{"slug":"GITHUB_CREATE_A_REPOSITORY_USING_A_TEMPLATE","toolkit":"github","name":"Create a repository using a template","description":"Creates a new repository from an existing template repository; the authenticated user must have access to the template and, if creating in an organization, repository creation permissions within it.","requiredInputs":["name","template_repo","template_owner"],"family":"repo"},{"slug":"GITHUB_CREATE_A_REPOSITORY_VARIABLE","toolkit":"github","name":"Create a repository variable","description":"Creates a new, unencrypted variable in a repository for GitHub Actions workflows; fails if a variable with the same name already exists.","requiredInputs":["name","repo","owner","value"],"family":"repo"},{"slug":"GITHUB_CREATE_A_REPOSITORY_WEBHOOK","toolkit":"github","name":"Create a repository webhook","description":"Creates a webhook for a specified repository; requires admin permissions on the repository.","requiredInputs":["repo","owner"],"family":"repo"},{"slug":"GITHUB_CREATE_A_TAG_PROTECTION_STATE_FOR_A_REPOSITORY","toolkit":"github","name":"Create a tag protection state for a repository","description":"DEPRECATED: This API was sunset on August 30, 2024. Use GITHUB_CREATE_A_REPOSITORY_RULESET instead to create tag protection rules via repository rulesets.","requiredInputs":["repo","owner","pattern"],"family":"tag"},{"slug":"GITHUB_CREATE_A_TEMPORARY_PRIVATE_FORK","toolkit":"github","name":"Create a temporary private fork","description":"Creates a temporary private fork of the specified repository to address a security vulnerability, linking the fork to a GHSA ID that must be specifically associated with this repository; the fork may take up to 5 minutes to become accessible.","requiredInputs":["repo","owner","ghsa_id"],"family":"other"},{"slug":"GITHUB_CREATE_A_TREE","toolkit":"github","name":"Create a tree","description":"Creates a new Git tree object in a repository, defining file/directory structure by specifying tree entries, optionally building on a `base_tree` SHA; all provided SHAs must be valid.","requiredInputs":["repo","tree","owner"],"family":"other"},{"slug":"GITHUB_CREATE_DEPLOYMENT_PROTECTION_RULE","toolkit":"github","name":"Create a custom deployment protection rule on an environment","description":"Enables a custom deployment protection rule for an existing environment in a repository by linking a configured GitHub App (via `integration_id`) to control deployments.","requiredInputs":["repo","owner","environment_name"],"family":"deployment"},{"slug":"GITHUB_CREATE_JIT_RUNNER_CONFIG","toolkit":"github","name":"Create JIT runner config for repo","description":"Generates a temporary Just-In-Time (JIT) configuration for a new self-hosted GitHub Actions runner for a repository; any specified non-default `runner_group_id` must be an existing runner group accessible by the repository.","requiredInputs":["name","repo","owner","labels","runner_group_id"],"family":"repo"},{"slug":"GITHUB_CREATE_OR_UPDATE_AN_ENVIRONMENT","toolkit":"github","name":"Create or update an environment","description":"Creates a new environment or updates an existing one in a GitHub repository, allowing configuration of deployment protection rules such as wait timers and reviewers; ensure `environment_name` is URL-encoded if it contains special characters.","requiredInputs":["repo","owner","environment_name"],"family":"environment"},{"slug":"GITHUB_CREATE_OR_UPDATE_AN_ENVIRONMENT_SECRET","toolkit":"github", <script>
(function() {
  const nodesById = new Map(GRAPH.nodes.map(n => [n.slug, n]));

  // --- layout: cluster nodes by toolkit + family, sunflower-pack within each cluster ---
  const clusterKey = n => n.toolkit + '::' + n.family;
  const clusters = new Map();
  for (const n of GRAPH.nodes) {
    const k = clusterKey(n);
    if (!clusters.has(k)) clusters.set(k, { toolkit: n.toolkit, family: n.family, nodes: [] });
    clusters.get(k).nodes.push(n);
  }

  function layoutToolkit(clusterList, startX, startY, targetWidth) {
    clusterList.sort((a, b) => b.nodes.length - a.nodes.length);
    let x = startX, y = startY, rowH = 0, maxX = startX;
    for (const c of clusterList) {
      const radius = 26 + 15 * Math.sqrt(c.nodes.length);
      const diameter = radius * 2 + 36;
      if (x + diameter > startX + targetWidth && x > startX) {
        x = startX;
        y += rowH + 50;
        rowH = 0;
      }
      const cx = x + radius, cy = y + radius;
      c.cx = cx; c.cy = cy; c.radius = radius;
      const golden = Math.PI * (3 - Math.sqrt(5));
      c.nodes.forEach((n, i) => {
        if (c.nodes.length === 1) { n.x = cx; n.y = cy; return; }
        const r = radius * 0.82 * Math.sqrt((i + 0.5) / c.nodes.length);
        const theta = i * golden;
        n.x = cx + r * Math.cos(theta);
        n.y = cy + r * Math.sin(theta);
      });
      x += diameter;
      rowH = Math.max(rowH, diameter);
      maxX = Math.max(maxX, x);
    }
    return { bottom: y + rowH, right: maxX };
  }

  const gsClusters = [...clusters.values()].filter(c => c.toolkit === 'googlesuper');
  const ghClusters = [...clusters.values()].filter(c => c.toolkit === 'github');
  const band1 = layoutToolkit(gsClusters, 0, 0, 2600);
  layoutToolkit(ghClusters, 0, band1.bottom + 160, 2600);

  // --- degree (for node sizing) ---
  const degree = new Map();
  for (const e of GRAPH.edges) {
    degree.set(e.from, (degree.get(e.from) || 0) + 1);
    degree.set(e.to, (degree.get(e.to) || 0) + 1);
  }

  // --- SVG scaffolding ---
  const svg = document.getElementById('svg');
  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  const defs = el('defs', {});
  for (const [id, color] of [['arrow-lookup', 'var(--lookup)'], ['arrow-creates', 'var(--creates)'], ['arrow-resolve-identity', 'var(--resolve)']]) {
    const marker = el('marker', { id, viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '6', markerHeight: '6', orient: 'auto-start-reverse' });
    marker.appendChild(el('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: color }));
    defs.appendChild(marker);
  }
  svg.appendChild(defs);

  const viewport = el('g', { id: 'viewport' });
  svg.appendChild(viewport);

  const familyLabelsLayer = el('g', { class: 'familyLabels' });
  const edgeLayer = el('g', { class: 'edges' });
  const nodeLayer = el('g', { class: 'nodes' });
  viewport.appendChild(familyLabelsLayer);
  viewport.appendChild(edgeLayer);
  viewport.appendChild(nodeLayer);

  for (const c of clusters.values()) {
    const t = el('text', { x: c.cx, y: c.cy - c.radius - 8, 'text-anchor': 'middle', fill: '#5b6472', 'font-size': '13', 'font-weight': '600' });
    t.textContent = c.family + ' (' + c.nodes.length + ')';
    familyLabelsLayer.appendChild(t);
  }

  const toolkitColor = t => t === 'googlesuper' ? 'var(--googlesuper)' : 'var(--github)';

  const edgeEls = [];
  for (const e of GRAPH.edges) {
    const a = nodesById.get(e.from), b = nodesById.get(e.to);
    if (!a || !b) continue;
    const line = el('line', {
      x1: a.x, y1: a.y, x2: b.x, y2: b.y,
      stroke: 'var(--' + (e.type === 'lookup' ? 'lookup' : e.type === 'creates' ? 'creates' : 'resolve') + ')',
      'stroke-width': e.type === 'resolve-identity' ? 1 : 1.3,
      'stroke-dasharray': e.type === 'creates' ? '5,3' : e.type === 'resolve-identity' ? '1.5,3' : 'none',
      opacity: e.type === 'resolve-identity' ? 0.22 : 0.35,
      'marker-end': 'url(#arrow-' + e.type + ')',
    });
    line.dataset.type = e.type;
    line.dataset.from = e.from;
    line.dataset.to = e.to;
    edgeLayer.appendChild(line);
    edgeEls.push({ el: line, edge: e });
  }

  const nodeEls = new Map();
  for (const n of GRAPH.nodes) {
    const g = el('g', { class: 'nodeG', transform: 'translate(' + n.x + ',' + n.y + ')' });
    const r = 4 + Math.min(10, Math.sqrt(degree.get(n.slug) || 1) * 1.8);
    const circle = el('circle', { r, fill: toolkitColor(n.toolkit), stroke: '#0b0e14', 'stroke-width': 1, 'fill-opacity': 0.9 });
    g.appendChild(circle);
    g.dataset.slug = n.slug;
    g.dataset.toolkit = n.toolkit;
    g.style.cursor = 'pointer';
    nodeLayer.appendChild(g);
    nodeEls.set(n.slug, { g, circle, r, n });

    g.addEventListener('mouseenter', (ev) => showTooltip(n, ev));
    g.addEventListener('mousemove', (ev) => positionTooltip(ev));
    g.addEventListener('mouseleave', hideTooltip);
    g.addEventListener('click', () => selectNode(n.slug));
  }

  // --- pan & zoom ---
  let tx = 0, ty = 0, scale = 0.42;
  const wrap = document.getElementById('graphWrap');
  function applyTransform() {
    viewport.setAttribute('transform', 'translate(' + tx + ',' + ty + ') scale(' + scale + ')');
  }
  // center initial view
  function centerView() {
    const rect = wrap.getBoundingClientRect();
    tx = rect.width / 2 - (band1.right / 2) * scale;
    ty = 40;
    applyTransform();
  }
  window.addEventListener('resize', centerView);

  let dragging = false, lastX = 0, lastY = 0;
  wrap.addEventListener('mousedown', (e) => {
    if (e.target.closest('.nodeG')) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    wrap.classList.add('dragging');
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    tx += e.clientX - lastX; ty += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    applyTransform();
  });
  window.addEventListener('mouseup', () => { dragging = false; wrap.classList.remove('dragging'); });
  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const worldX = (mx - tx) / scale, worldY = (my - ty) / scale;
    const factor = Math.exp(-e.deltaY * 0.0012);
    scale = Math.min(6, Math.max(0.05, scale * factor));
    tx = mx - worldX * scale;
    ty = my - worldY * scale;
    applyTransform();
  }, { passive: false });

  // --- tooltip ---
  const tooltip = document.getElementById('tooltip');
  function showTooltip(n) {
    tooltip.innerHTML = '<div class="t-slug">' + n.slug + '</div><div style="margin-top:3px;color:#b7bfcc">' + (n.name || '') + '</div>';
    tooltip.style.display = 'block';
  }
  function positionTooltip(ev) {
    const rect = wrap.getBoundingClientRect();
    tooltip.style.left = (ev.clientX - rect.left + 14) + 'px';
    tooltip.style.top = (ev.clientY - rect.top + 10) + 'px';
  }
  function hideTooltip() { tooltip.style.display = 'none'; }

  // --- selection / detail panel ---
  const detail = document.getElementById('detail');
  let selected = null;

  function edgeTag(type) {
    return '<span class="tag ' + type + '">' + type + '</span>';
  }

  function selectNode(slug) {
    selected = slug;
    const n = nodesById.get(slug);
    for (const { g, circle, r } of nodeEls.values()) {
      const isSel = g.dataset.slug === slug;
      circle.setAttribute('stroke', isSel ? '#fff' : '#0b0e14');
      circle.setAttribute('stroke-width', isSel ? 2.5 : 1);
      circle.setAttribute('r', isSel ? r * 1.6 : r);
    }
    const incoming = GRAPH.edges.filter(e => e.to === slug);
    const outgoing = GRAPH.edges.filter(e => e.from === slug);

    for (const { el: line, edge } of edgeEls) {
      const related = edge.from === slug || edge.to === slug;
      line.style.opacity = related ? 0.9 : 0.05;
    }

    let html = '<h2>' + (n.name || n.slug) + '</h2>';
    html += '<div class="slugline">' + n.slug + ' &middot; ' + n.toolkit + '</div>';
    html += '<div class="desc">' + (n.description || '') + '</div>';

    if (n.requiredInputs.length) {
      html += '<div class="section-title">Required inputs</div>';
      html += n.requiredInputs.map(r => '<span class="req">' + r + '</span>').join('');
    }

    html += '<div class="section-title">Depends on (' + incoming.length + ')</div>';
    html += incoming.length ? incoming.map(e => edgeRow(e, e.from)).join('') : '<div class="edgeItem" style="border-color:transparent;color:var(--muted)">none detected</div>';

    html += '<div class="section-title">Enables (' + outgoing.length + ')</div>';
    html += outgoing.length ? outgoing.map(e => edgeRow(e, e.to)).join('') : '<div class="edgeItem" style="border-color:transparent;color:var(--muted)">none detected</div>';

    detail.innerHTML = html;
    detail.querySelectorAll('[data-jump]').forEach(elm => {
      elm.addEventListener('click', () => selectNode(elm.dataset.jump));
    });
  }

  function edgeRow(e, otherSlug) {
    const other = nodesById.get(otherSlug);
    return '<div class="edgeItem" data-jump="' + otherSlug + '">' +
      '<div class="who">' + otherSlug + edgeTag(e.type) + '</div>' +
      '<div class="note">' + e.note + '</div>' +
      '</div>';
  }

  // --- filters ---
  const toolkitState = { googlesuper: true, github: true };
  const etypeState = { lookup: true, creates: true, 'resolve-identity': true };

  function applyFilters() {
    for (const { g, n } of nodeEls.values()) {
      const visible = toolkitState[n.toolkit];
      g.style.display = visible ? '' : 'none';
    }
    for (const l of familyLabelsLayer.children) {
      // recompute visibility based on any node in that family's toolkit being visible
    }
    for (const { el: line, edge } of edgeEls) {
      const a = nodesById.get(edge.from), b = nodesById.get(edge.to);
      const visible = toolkitState[a.toolkit] && toolkitState[b.toolkit] && etypeState[edge.type];
      line.style.display = visible ? '' : 'none';
    }
    document.querySelectorAll('.familyLabels text').forEach((t, i) => {
      const c = [...clusters.values()][i];
      t.style.display = toolkitState[c.toolkit] ? '' : 'none';
    });
  }

  document.querySelectorAll('[data-toolkit]').forEach(cb => {
    cb.addEventListener('change', () => { toolkitState[cb.dataset.toolkit] = cb.checked; applyFilters(); });
  });
  document.querySelectorAll('[data-etype]').forEach(cb => {
    cb.addEventListener('change', () => { etypeState[cb.dataset.etype] = cb.checked; applyFilters(); });
  });

  // --- search ---
  const search = document.getElementById('search');
  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    for (const { g, circle, r, n } of nodeEls.values()) {
      if (!q) { g.style.opacity = 1; circle.setAttribute('r', r); continue; }
      const match = n.slug.toLowerCase().includes(q) || (n.name || '').toLowerCase().includes(q);
      g.style.opacity = match ? 1 : 0.08;
      circle.setAttribute('r', match ? r * 1.4 : r);
    }
  });

  // --- stats ---
  document.getElementById('stats').textContent =
    GRAPH.nodeCount + ' tools with dependencies · ' + GRAPH.edgeCount + ' edges · scanned ' + GRAPH.totalToolsScanned + ' tools total';

  centerView();
})();
</script>
</body>
</html>
