r, published, publishAuto, publishedOutsideDomain). IMPORTANT: This action does NOT update file content. To update file content, use EDIT_FILE or UPDATE_FILE_PUT instead. This action requires BOTH file_id AND revision_id parameters. Use LIST_REVISIONS to get available revision IDs for a file. Valid parameters: file_id (required), revision_id (required), keep_forever, published, publish_auto, published_outside_domain. Invalid parameters (use other actions): file_contents, mime_type, content, name - these are NOT supported by this action.","requiredInputs":["file_id","revision_id"],"family":"file"},{"slug":"GOOGLESUPER_UPDATE_PERMISSION","toolkit":"googlesuper","name":"Update Permission","description":"Tool to update a permission with patch semantics. Use when you need to modify an existing permission for a file or shared drive. Inherited or domain-managed permissions may not be editable; verify editability with GOOGLEDRIVE_LIST_PERMISSIONS before updating.","requiredInputs":["fileId","permission","permissionId"],"family":"permission"},{"slug":"GOOGLESUPER_UPDATE_REPLY","toolkit":"googlesuper","name":"Update Reply","description":"Tool to update a reply to a comment on a Google Drive file. Use when you need to modify the content of an existing reply.","requiredInputs":["content","file_id","reply_id","comment_id"],"family":"reply"},{"slug":"GOOGLESUPER_UPDATE_SHEET_PROPERTIES","toolkit":"googlesuper","name":"Update Sheet Properties","description":"Tool to update properties of a sheet (worksheet) within a Google Spreadsheet, such as its title, index, visibility, tab color, or grid properties. Use this when you need to modify the metadata or appearance of a specific sheet.","requiredInputs":["spreadsheetId","updateSheetProperties"],"family":"sheet"},{"slug":"GOOGLESUPER_UPDATE_SPREADSHEET_PROPERTIES","toolkit":"googlesuper","name":"Update Spreadsheet Properties","description":"Tool to update SPREADSHEET-LEVEL properties such as the spreadsheet's title, locale, time zone, or auto-recalculation settings. Use when you need to modify the overall configuration of a Google Spreadsheet. NOTE: To update individual SHEET properties (like renaming a specific sheet/tab), use GOOGLESHEETS_UPDATE_SHEET_PROPERTIES instead.","requiredInputs":["fields","properties","spreadsheetId"],"family":"spreadsheet"},{"slug":"GOOGLESUPER_UPDATE_TASK","toolkit":"googlesuper","name":"Update Task (Deprecated)","description":"DEPRECATED: Use GOOGLETASKS_PATCH_TASK instead. Full-update (PUT-style) operation that overwrites unspecified fields with empty/default values, which can cause data loss. Prefer GOOGLETASKS_PATCH_TASK unless a complete field replacement is explicitly required.","requiredInputs":["task_id","tasklist_id"],"family":"task"},{"slug":"GOOGLESUPER_UPDATE_TASK_FULL","toolkit":"googlesuper","name":"Update Task (Full Replacement)","description":"Tool to fully replace an existing Google Task using PUT method. Use when you need to update the entire task resource, not just specific fields. This method requires all required fields (id, title) and replaces the complete task, unlike PATCH which supports partial updates.","requiredInputs":["id","title","task_id","tasklist_id"],"family":"task"},{"slug":"GOOGLESUPER_UPDATE_VALUES_BATCH","toolkit":"googlesuper","name":"Batch update spreadsheet values","description":"Tool to set values in one or more ranges of a spreadsheet. Use when you need to update multiple ranges in a single operation for better performance.","requiredInputs":["data","spreadsheet_id","valueInputOption"],"family":"spreadsheet"},{"slug":"GOOGLESUPER_UPLOAD_UPDATE_FILE","toolkit":"googlesuper","name":"Upload/Update File Content","description":"Tool to update file content in Google Drive by uploading new binary content. Use when you need to replace the contents of an existing file with new file data.","requiredInputs":["fileId","file_to_upload"],"family":"file"},{"slug":"GOOGLESUPER_UPSERT_ROWS","toolkit":"googlesuper","name":"Upsert Rows (Smart Update/Insert)","description":"Upsert rows - update existing rows by key, append new ones. Automatically handles column mapping and partial updates. Use for: CRM syncs (match Lead ID), transaction imports (match Transaction ID), inventory updates (match SKU), calendar syncs (match Event ID). Features: - Auto-adds missing columns to sheet - Partial column updates (only update Phone + Status, preserve other columns) - Column order doesn't matter (auto-maps by header name) - Prevents duplicates by matching key column Example inputs: - Contact update: keyColumn='Email', headers=['Email','Phone','Status'], data=[['john@ex.com','555-0101','Active']] - Inventory sync: keyColumn='SKU', headers=['SKU','Stock','Price'], data=[['WIDGET-001',50,9.99],['GADGET-002',30,19.99]] - CRM lead update: keyColumn='Lead ID', headers=['Lead ID','Score','Status'], data=[['L-12345',85,'Hot']] - Partial update: keyColumn='Email', headers=['Email','Phone'] (only updates Phone, preserves Name/Address/etc)","requiredInputs":["rows","sheetName","spreadsheetId"],"family":"other"},{"slug":"GOOGLESUPER_VALUES_GET","toolkit":"googlesuper","name":"Get spreadsheet values","description":"Returns a range of values from a spreadsheet. Use when you need to read data from specific cells or ranges in a Google Sheet.","requiredInputs":["range","spreadsheet_id"],"family":"spreadsheet"},{"slug":"GOOGLESUPER_VALUES_UPDATE","toolkit":"googlesuper","name":"Update spreadsheet values","description":"Tool to set values in a range of a Google Spreadsheet. Use when you need to update or overwrite existing cell values in a specific range.","requiredInputs":["range","values","spreadsheet_id","value_input_option"],"family":"spreadsheet"},{"slug":"GOOGLESUPER_WATCH_FILE","toolkit":"googlesuper","name":"Watch File for Changes","description":"Tool to subscribe to push notifications for changes to a specific file. Use when you need to monitor a file for modifications and receive real-time notifications at a webhook URL.","requiredInputs":["id","type","fileId","address"],"family":"file"},{"slug":"GITHUB_GET_ENTERPRISE_MEMBER_INVITATION","toolkit":"github","name":"Get Enterprise Member Invitation","description":"Tool to look up a pending enterprise unaffiliated member invitation by invitee and enterprise. Use when you need to check the status of a specific invitation.","requiredInputs":["user_login","enterprise_slug"],"family":"invitation"},{"slug":"GITHUB_ACCEPT_REPOSITORY_INVITATION","toolkit":"github","name":"Accept a repository invitation","description":"Accepts a PENDING repository invitation that has been issued to the authenticated user.","requiredInputs":["invitation_id"],"family":"repo"},{"slug":"GITHUB_LOOKUP_ENTERPRISE_ADMINISTRATOR_INVITATION","toolkit":"github","name":"Lookup Enterprise Administrator Invitation","description":"Tool to look up a pending enterprise administrator invitation by invitee, enterprise, and role. Use when you need to check if a specific user has a pending invitation to become an enterprise administrator.","requiredInputs":["role","user_login","enterprise_slug"],"family":"invitation"},{"slug":"GITHUB_LIST_BRANCHES","toolkit":"github","name":"List branches","description":"List branches in a GitHub repository. Returns branch names, commit information, and protection status. Use this action when you need to retrieve all branches in a repository, optionally filtered by protection status. This is useful for identifying available branches, checking which branches are protected, or preparing to create pull requests.","requiredInputs":["repo","owner"],"family":"other"},{"slug":"GITHUB_ADD_APP_ACCESS_RESTRICTIONS","toolkit":"github","name":"Add app access restrictions","description":"Adds GitHub Apps to the list of apps allowed to push to a protected branch. The branch must already have protection rules with restrictions enabled. This endpoint only works for organization repositories, not personal repositories. Apps must be installed on the repository with 'contents' write permissions.","requiredInputs":["apps","repo","owner","branch"],"family":"other"},{"slug":"GITHUB_LIST_BRANCHES_FOR_HEAD_COMMIT","toolkit":"github","name":"List branches for head commit","description":"Lists branches in an accessible repository where the provided commit SHA is the head, useful for identifying development lines based on that commit.","requiredInputs":["repo","owner","commit_sha"],"family":"commit"},{"slug":"GITHUB_LIST_ISSUE_EVENTS_FOR_A_REPOSITORY","toolkit":"github","name":"List issue events for a repository","description":"Lists all issue events (e.g., closed, reopened, assigned) for a specified repository.","requiredInputs":["repo","owner"],"family":"issue"},{"slug":"GITHUB_ADD_ASSIGNEES_TO_AN_ISSUE","toolkit":"github","name":"Add assignees to an issue","description":"Adds assignees to a GitHub issue. This action only adds users - it does not remove existing assignees. Changes are silently ignored if the authenticated user lacks push access to the repository.","requiredInputs":["repo","owner","issue_number"],"family":"issue"},{"slug":"GITHUB_LIST_ISSUES_ASSIGNED_TO_THE_AUTHENTICATED_USER","toolkit":"github","name":"List issues for user","description":"Lists GitHub issues for the authenticated user across visible repositories, with filtering by user relationship, state, labels, an ISO 8601 `since` timestamp (YYYY-MM-DDTHH:MM:SSZ), and sorting options; pull requests are typically included.","requiredInputs":[],"family":"user"},{"slug":"GITHUB_LIST_ORG_ISSUES_FOR_THE_AUTHENTICATED_USER","toolkit":"github","name":"List organization issues assigned to the authenticated user","description":"Lists issues for the authenticated user within a specified GitHub organization, with options to filter by involvement type, state, labels, and to sort results.","requiredInputs":["org"],"family":"org"},{"slug":"GITHUB_LIST_ORGANIZATION_PROJECTS","toolkit":"github","name":"List organization projects","description":"Lists projects (V2) for a specified GitHub organization, with optional search query and cursor-based pagination.","requiredInputs":["org"],"family":"org"},{"slug":"GITHUB_ADD_FIELD_TO_USER_PROJECT","toolkit":"github","name":"Add field to user project","description":"Tool to add a custom field to a user-owned GitHub Projects V2 project. Use when you need to add fields like status, priority, or custom data to organize project items.","requiredInputs":["name","username","data_type","project_number"],"family":"user"},{"slug":"GITHUB_LIST_REPOSITORY_PROJECTS","toolkit":"github","name":"List repository projects","description":"Lists Projects (classic) associated with a specific repository. Note: This action lists GitHub Projects (classic), which is GitHub's legacy project management feature. If the repository has Projects (classic) disabled or uses the newer Projects V2, this will return an empty list. Most modern repositories use Projects V2 (GraphQL API) instead of Projects (classic).","requiredInputs":["repo","owner"],"family":"repo"},{"slug":"GITHUB_LIST_TEAM_PROJECTS","toolkit":"github","name":"List team projects","description":"Lists GitHub projects accessible to a specific team within an organization.","requiredInputs":["org","team_slug"],"family":"team"},{"slug":"GITHUB_ADD_ITEM_TO_USER_PROJECT","toolkit":"github","name":"Add item to user project","description":"Tool to add an issue or pull request to a user-owned GitHub project. Use when you need to add existing repository items to a project board.","requiredInputs":["type","username","project_number"],"family":"user"},{"slug":"GITHUB_ADD_LABELS_TO_AN_ISSUE","toolkit":"github","name":"Add labels to an issue","description":"Adds labels (provided in the request body) to a repository issue; labels that do not already exist are created.","requiredInputs":["repo","owner","labels","issue_number"],"family":"issue"},{"slug":"GITHUB_FIND_PULL_REQUESTS","toolkit":"github","name":"Find Pull Requests","description":"Primary tool to find and search pull requests. Supports filtering by repository, author, state, labels, and merge status, and returns structured PR data for reliable use in workflows. GitHub search results are capped at ~1000 total items; narrow filters when totals approach this limit. `created_since`/`updated_since` filter on creation/update timestamps, not `merged_at`; apply merge-date filtering client-side.","requiredInputs":[],"family":"pull"},{"slug":"GITHUB_ADD_OR_UPDATE_TEAM_MEMBERSHIP_FOR_USER","toolkit":"github","name":"Add or update team membership for a user","description":"Adds a GitHub user to a team or updates their role (member or maintainer), inviting them to the organization if not already a member; idempotent, returning current details if no change is made.","requiredInputs":["org","username","team_slug"],"family":"team"},{"slug":"GITHUB_LIST_ISSUE_EVENTS","toolkit":"github","name":"List issue events","description":"Retrieves a list of all events for a specific issue within a GitHub repository.","requiredInputs":["repo","owner","issue_number"],"family":"issue"},{"slug":"GITHUB_LIST_PULL_REQUESTS","toolkit":"github","name":"List pull requests","description":"Lists pull requests for a GitHub repository. REQUIRES 'owner' AND 'repo' parameters - both are MANDATORY and must be provided in every call. Does NOT support filtering by assignee or date range - use GITHUB_FIND_PULL_REQUESTS instead for searching PRs by assignee, author, or across multiple repositories.","requiredInputs":["repo","owner"],"family":"pull"},{"slug":"GITHUB_ADD_OR_UPDATE_TEAM_PROJECT_PERMISSIONS","toolkit":"github","name":"Add or update team project permissions","description":"Adds a classic project to a team or updates the team's permission on it. This endpoint grants or updates permissions for a team on a specific classic project (not Projects V2). The authenticated user must have admin permissions for the project. Both the team and project must belong to the same organization. Requirements: - The project must be a classic project (not GitHub Projects V2) - The authenticated user must have admin permissions on the project - The team and project must be in the same organization - Requires 'admin:org' scope for the authentication token Returns HTTP 204 No Content on success, 403 if project is not an org project, or 404 if the organization, team, or project is not found.","requiredInputs":["org","team_slug","project_id"],"family":"team"},{"slug":"GITHUB_LIST_ORG_PROJECT_VIEW_ITEMS","toolkit":"github","name":"List organization project view items","description":"Tool to list items for an organization project view. Use when you need to retrieve all items from a specific view within a GitHub organization's Projects V2 project. Returns a list of project items with their content, metadata, and field values.","requiredInputs":["org","view_number","project_number"],"family":"org"},{"slug":"GITHUB_LIST_PROJECT_CARDS","toolkit":"github","name":"List project cards (Classic - Deprecated)","description":"Lists all project cards for a given column_id in GitHub Projects (classic). DEPRECATION NOTICE: GitHub Projects (classic) and its REST API were sunset on April 1, 2025. This action will return 404 for most requests on GitHub.com. However, it may still work on GitHub Enterprise Server instances where classic projects are enabled. For new projects, use GitHub Projects V2 which uses the GraphQL API instead. See: https://github.blog/changelog/2024-05-23-sunset-notice-projects-classic/ Returns a list of project cards including: id, node_id, url, note (or null for linked cards), creator info, content_url (for issue/PR cards), column_url, project_url, timestamps, and archived status.","requiredInputs":["column_id"],"family":"project"},{"slug":"GITHUB_LIST_PROJECT_FIELDS_FOR_USER","toolkit":"github","name":"List project fields for user","description":"Tool to list all fields in a GitHub Projects V2 project for a specific user. Use when you need to see available fields in a project.","requiredInputs":["username","project_number"],"family":"project"},{"slug":"GITHUB_ADD_OR_UPDATE_TEAM_REPOSITORY_PERMISSIONS","toolkit":"github","name":"Add or update team repository permissions","description":"Sets or updates a team's permission level for a repository within an organization; the team must be a member of the organization.","requiredInputs":["org","repo","owner","team_slug"],"family":"team"},{"slug":"GITHUB_ADD_PROJECT_COLLABORATOR","toolkit":"github","name":"Add project collaborator","description":"Adds a specified GitHub user as a collaborator to an existing organization project with a given permission level. Note: This endpoint is for organization projects (classic). You must be an organization owner or a project admin to add a collaborator. Classic projects are being deprecated in favor of the new Projects experience.","requiredInputs":["username","project_id"],"family":"project"},{"slug":"GITHUB_LIST_INSTALLATION_REQUESTS_FOR_THE_AUTHENTICATED_APP","toolkit":"github","name":"List installation requests for the authenticated app","description":"Lists pending installation requests made by users or organizations for the authenticated GitHub App.","requiredInputs":[],"family":"installation"},{"slug":"GITHUB_ADD_REPOSITORY_TO_APP_INSTALLATION","toolkit":"github","name":"Add a repository to an app installation","description":"Adds a repository to a GitHub App installation, granting the app access; requires authenticated user to have admin rights for the repository and access to the installation.","requiredInputs":["repository_id","installation_id"],"family":"repo"},{"slug":"GITHUB_ADD_STATUS_CHECK_CONTEXTS","toolkit":"github","name":"Add status check contexts","description":"Adds status check contexts to a protected branch's required status checks. This action appends new status check contexts to the existing list of required status checks for a protected branch. The branch must already have branch protection enabled with status checks configured. Note: The 'contexts' parameter is deprecated by GitHub in favor of 'checks' array. For new implementations, consider using update_status_check_protection with the 'checks' parameter instead.","requiredInputs":["repo","owner","branch","contexts"],"family":"other"},{"slug":"GITHUB_LIST_ISSUE_COMMENTS","toolkit":"github","name":"List issue comments","description":"Lists comments for a specified issue in a GitHub repository.","requiredInputs":["repo","owner","issue_number"],"family":"issue"},{"slug":"GITHUB_ADD_SUB_ISSUE","toolkit":"github","name":"Add sub-issue to an issue","description":"Tool to add a sub-issue to a parent GitHub issue using GraphQL. Use when you need to establish a parent-child relationship between issues. Requires the 'sub_issues' GraphQL feature to be enabled.","requiredInputs":["issue_id"],"family":"issue"},{"slug":"GITHUB_LIST_ISSUE_COMMENTS_FOR_A_REPOSITORY","toolkit":"github","name":"List issue comments for a repository","description":"Lists issue comments, including those on pull requests, for an accessible repository.","requiredInputs":["repo","owner"],"family":"issue"},{"slug":"GITHUB_LIST_ISSUE_DEPENDENCIES_BLOCKED_BY","toolkit":"github","name":"List issue dependencies blocked by","description":"Tool to list dependencies an issue is blocked by. Use when you need to retrieve all issues that are blocking a specific issue from being closed or completed.","requiredInputs":["repo","owner","issue_number"],"family":"issue"},{"slug":"GITHUB_ADD_TEAM_ACCESS_RESTRICTIONS","toolkit":"github","name":"Add team access restrictions","description":"Adds teams to the list of teams with push access to a protected branch. This action grants additional teams push access to a protected branch. Unlike 'Set team access restrictions' (PUT), this action adds to the existing list rather than replacing it entirely. Prerequisites: - The repository must be owned by an organization (not a personal account) - The branch must have protection rules enabled - The branch protection must have restrictions er"},{"slug":"GITHUB_LIST_PUBLIC_GISTS","toolkit":"github","name":"List public gists","description":"Lists public gists from GitHub, optionally filtering by a 'since' timestamp and supporting pagination; results are generally newest first.","requiredInputs":[],"family":"other"},{"slug":"GITHUB_CHECK_IF_PULL_REQUEST_HAS_BEEN_MERGED","toolkit":"github","name":"Check if pull request merged","description":"Checks if a specified GitHub pull request has been merged, indicated by a 204 HTTP status (merged) or 404 (not merged/found).","requiredInputs":["repo","owner","pull_number"],"family":"pull"},{"slug":"GITHUB_LIST_PULL_REQUESTS_ASSOCIATED_WITH_A_COMMIT","toolkit":"github","name":"List pull requests associated with a commit","description":"Lists pull requests for a commit; returns merged PRs that introduced the commit if on the default branch, or open PRs including the commit if on other branches.","requiredInputs":["repo","owner","commit_sha"],"family":"pull"},{"slug":"GITHUB_CHECK_IF_PULL_REQUEST_MERGED","toolkit":"github","name":"Check if pull request merged","description":"Checks if a pull request has been merged by querying the GitHub API. Use this action when you need to verify whether a specific pull request has been successfully merged into its target branch. The API returns a 204 status for merged PRs and 404 for unmerged PRs.","requiredInputs":["repo","owner","pull_number"],"family":"pull"},{"slug":"GITHUB_CHECK_IF_USER_CAN_BE_ASSIGNED_TO_ISSUE","toolkit":"github","name":"Check if a user can be assigned to an issue","description":"Checks if a specified GitHub user can be assigned to a given issue within a repository.","requiredInputs":["repo","owner","assignee","issue_number"],"family":"user"},{"slug":"GITHUB_CHECK_TEAM_PERMISSIONS_FOR_A_PROJECT","toolkit":"github","name":"Check team permissions for a project","description":"Checks if a team has 'read', 'write', or 'admin' permissions for an organization's specific classic project, returning the project's details if access is confirmed.","requiredInputs":["org","team_slug","project_id"],"family":"team"},{"slug":"GITHUB_CHECK_TEAM_PERMISSIONS_FOR_A_REPOSITORY","toolkit":"github","name":"Check team permissions for a repository","description":"Checks a team's permissions for a specific repository within an organization, including permissions inherited from parent teams.","requiredInputs":["org","repo","owner","team_slug"],"family":"team"},{"slug":"GITHUB_CLEAR_PROJECT_V2_ITEM_FIELD_VALUE","toolkit":"github","name":"Clear Project V2 Item Field Value","description":"Tool to clear the value of a field for an item in a GitHub Project V2. Use when you need to remove or reset a field value (text, number, date, assignees, labels, single-select, iteration, or milestone fields).","requiredInputs":["itemId","fieldId","projectId"],"family":"project"},{"slug":"GITHUB_CLOSE_ISSUE","toolkit":"github","name":"Close an issue","description":"Close a GitHub issue by setting its state to closed. Use this action when you need to mark an issue as resolved or no longer relevant. Optionally specify a reason for closing (completed or not_planned) to provide context.","requiredInputs":["repo","owner","issue_number"],"family":"issue"},{"slug":"GITHUB_CLOSE_PULL_REQUEST","toolkit":"github","name":"Close a pull request","description":"Closes an open pull request without merging it. The pull request state is set to \"closed\" and it can be reopened later if needed. Use this action when you want to reject or abandon a pull request without merging the proposed changes into the base branch. You must have write access to the repository to close pull requests.","requiredInputs":["repo","owner","pull_number"],"family":"pull"},{"slug":"GITHUB_COMMIT_MULTIPLE_FILES","toolkit":"github","name":"Commit Multiple Files","description":"Tool to atomically create, update, or delete multiple files in a GitHub repository as a single commit. Uses Git Data APIs to avoid SHA mismatch conflicts that occur with the Contents API when multiple files are modified in parallel. Use when you need to make multi-file changes reliably. BRANCH CREATION: When committing to a new branch (e.g., 'fix/my-fix' or 'feature/new-feature'), you MUST provide 'base_branch' (typically 'main' or 'master') to create the branch from. If the branch already exists, base_branch is not needed. This action handles race conditions automatically: if the branch is updated by another commit between fetching the HEAD and updating the reference (resulting in a 422 'not a fast forward' error), the action will retry by refetching the HEAD and rebasing changes. Use max_retries to control this behavior.","requiredInputs":["repo","owner","branch","message"],"family":"commit"},{"slug":"GITHUB_CREATE_A_CODESPACE_FROM_A_PULL_REQUEST","toolkit":"github","name":"Create a codespace from a pull request","description":"Creates a GitHub Codespace for an open pull request in a Codespaces-enabled repository, with options to customize its configuration.","requiredInputs":["repo","owner","pull_number"],"family":"pull"},{"slug":"GITHUB_LIST_COMMITS","toolkit":"github","name":"List commits","description":"Lists commits for a GitHub repository. Requires 'owner' (username/org) and 'repo' (repository name) parameters. Optionally filter by SHA/branch, path, author, committer, or date range.","requiredInputs":["repo","owner"],"family":"other"},{"slug":"GITHUB_CREATE_A_COMMIT_COMMENT","toolkit":"github","name":"Create a commit comment","description":"Creates a comment on a specific commit, or on a specific line if `path` and `position` are provided.","requiredInputs":["body","repo","owner","commit_sha"],"family":"commit"},{"slug":"GITHUB_LIST_COMMITS_ON_A_PULL_REQUEST","toolkit":"github","name":"List commits on a pull request","description":"Lists commits for a pull request; requires the repository and pull request to exist and be accessible, and supports pagination.","requiredInputs":["repo","owner","pull_number"],"family":"pull"},{"slug":"GITHUB
